function loadUserSession() {
  const savedEmail = localStorage.getItem('pythonlab_user_email') || '';
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(onUserSessionSuccess)
      .withFailureHandler(onUserSessionError)
      .getUserSessionData(savedEmail);
  } else {
    // Modo de Desenvolvimento Local / Preview
    console.info('Executando fora do ambiente Google Apps Script. Ativando mock local.');
    const emailMock = savedEmail || 'neylor@gmail.com';
    onUserSessionSuccess({
      autenticado: true,
      email: emailMock,
      nome: emailMock.split('@')[0],
      perfil: emailMock.includes('prof') ? 'professor' : 'aluno',
      xpTotal: 480,
      progressoIds: ['aula_1_1'],
      duvidasPendentes: [
        {
          idAula: 'aula_1_2',
          idTopico: 'Variáveis e Memória',
          duvida: 'Não entendi por que y continua apontando para 10 no Heap depois que fiz x += 5.',
          data: new Date().toISOString()
        }
      ],
      ultimaAulaAcessada: 'aula_1_2',
      podeGravar: true,
      isProfessor: emailMock.includes('prof')
    });
  }
}

function onUserSessionSuccess(userData) {
  AppState.user = userData;
  if (userData && userData.autenticado && userData.email) {
    localStorage.setItem('pythonlab_user_email', userData.email);
  }
  renderHeaderUser();
  renderVisitorModalContent();
  renderizarDuvidasDashboard();
  
  if (userData.ultimaAulaAcessada) {
    const labelEl = document.getElementById('dash-onde-parei-titulo');
    if (labelEl) labelEl.textContent = `Aula: ${userData.ultimaAulaAcessada}`;
  }
  
  // Se for professor, exibe atalho no menu
  const teacherTab = document.getElementById('nav-teacher');
  if (teacherTab) {
    teacherTab.style.display = userData.isProfessor ? 'inline-flex' : 'none';
  }

  // Atualiza modo de visualização e imagens didáticas da aula ativa
  aplicarModoVisualizacaoAula(AppState.modoVisualizacaoAula || 'explicacoes', false);
  carregarImagensAula(AppState.currentLessonId || 'aula_1_2');
}

function onUserSessionError(error) {
  console.warn('Erro ao obter sessão:', error);
  showToast('Sessão em modo visitante.', 'info');
  renderVisitorModalContent();
}

function navigateTo(viewId) {
  // Atualiza classes ativas nos links de navegação
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeBtn = document.querySelector(`.nav-item[data-view="${viewId}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  // Alterna as seções de visualização
  document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
  const targetSec = document.getElementById(viewId);
  if (targetSec) {
    targetSec.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Se a rota for o painel do professor, carrega o relatório consolidado
  if (viewId === 'view-professor') {
    carregarRelatorioProfessor();
  }
}

function renderHeaderUser() {
  const user = AppState.user;
  const avatarEl = document.getElementById('header-user-avatar');
  const nameEl = document.getElementById('header-user-name');
  const xpEl = document.getElementById('header-user-xp');
  const roleEl = document.getElementById('header-user-role');

  if (avatarEl) {
    avatarEl.textContent = user.nome ? user.nome.charAt(0).toUpperCase() : 'V';
  }
  if (nameEl) {
    nameEl.textContent = user.nome || 'Visitante';
  }
  if (xpEl) {
    xpEl.textContent = (user.xpTotal || 0) + ' XP';
  }
  if (roleEl) {
    roleEl.textContent = user.perfil;
    roleEl.className = 'role-tag role-' + user.perfil;
  }
}

  if (!container) return;

  // Agrupa aulas por módulo
  const modulesMap = {};

    if (!modulesMap[item.modulo]) {
      modulesMap[item.modulo] = [];

/**
 * ============================================================================
 * MOTOR DO SIMULADOR PASSO A PASSO & RASTREIO DE MEMÓRIA
 * ============================================================================
 */

function initSimulation(steps) {
  AppState.simulationSteps = steps;
  AppState.currentStepIndex = 0;
  renderStepperButtons();
  goToStep(0);
}

function renderStepperButtons() {
  const container = document.getElementById('step-buttons-container');
  if (!container) return;

  let html = '';
  AppState.simulationSteps.forEach((s, idx) => {
    html += `
      <button class="btn btn-outline step-btn-pill" id="step-pill-${idx}" style="padding: 0.25rem 0.65rem; min-width: 2rem; font-size: 0.8rem;" onclick="goToStep(${idx})">
        ${idx}
      </button>
    `;
  });
  container.innerHTML = html;
}

function goToStep(index) {
  if (index < 0 || index >= AppState.simulationSteps.length) return;
  AppState.currentStepIndex = index;
  const step = AppState.simulationSteps[index];

  // 1. Atualiza botões de navegação
  const btnPrev = document.getElementById('btn-step-prev');
  const btnNext = document.getElementById('btn-step-next');
  if (btnPrev) btnPrev.disabled = (index === 0);
  if (btnNext) btnNext.disabled = (index === AppState.simulationSteps.length - 1);

  // Destaque visual dos botões numéricos
  document.querySelectorAll('.step-btn-pill').forEach(btn => {
    btn.style.backgroundColor = 'transparent';
    btn.style.color = 'var(--color-on-surface)';
    btn.style.borderColor = 'var(--color-outline-variant)';
  });
  const activePill = document.getElementById(`step-pill-${index}`);
  if (activePill) {
    activePill.style.backgroundColor = 'var(--color-primary)';
    activePill.style.color = '#ffffff';
    activePill.style.borderColor = 'var(--color-primary)';
  }

  // 2. Destaque da linha de código ativa
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  const targetCodeLine = document.getElementById(`code-line-${step.line}`);
  if (targetCodeLine) targetCodeLine.classList.add('active');

  // 3. Atualiza Insight Card Didático
  const titleEl = document.getElementById('insight-title');
  const descEl = document.getElementById('insight-desc');
  if (titleEl) titleEl.textContent = step.insightTitle;
  if (descEl) descEl.textContent = step.insightDesc;

  // 4. Renderiza Call Stack
  const stackContainer = document.getElementById('stack-frame-vars');
  if (stackContainer) {
    if (step.stack.length === 0) {
      stackContainer.innerHTML = '<div style="font-size: 0.8rem; color: var(--color-outline); padding: 0.5rem 0;">(Nenhuma variável no escopo local)</div>';
    } else {
      let stackHtml = '';
      step.stack.forEach(v => {
        stackHtml += `
          <div class="memory-box updated">
            <div>
              <div class="memory-var-name">${v.name}</div>
              <div class="memory-var-desc">${v.type}</div>
            </div>
            <div class="memory-pointer-badge">
              <span>${v.addr}</span>
              <span>→</span>
            </div>
          </div>
        `;
      });
      stackContainer.innerHTML = stackHtml;
    }
  }

  // 5. Renderiza Heap Space
  const heapContainer = document.getElementById('heap-objects-grid');
  if (heapContainer) {
    if (step.heap.length === 0) {
      heapContainer.innerHTML = '<div style="font-size: 0.8rem; color: var(--color-outline); padding: 0.5rem 0;">(Nenhum objeto alocado no Heap)</div>';
    } else {
      let heapHtml = '';
      step.heap.forEach(obj => {
        heapHtml += `
          <div class="heap-object-cell">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="heap-addr">${obj.addr}</span>
              <span class="heap-type-badge">${obj.type}</span>
            </div>
            <div class="heap-val">${obj.val}</div>
          </div>
        `;
      });
      heapContainer.innerHTML = heapHtml;
    }
  }

  // 6. Atualiza Terminal Stdout
  const stdoutEl = document.getElementById('terminal-stdout-output');
  if (stdoutEl) {
    stdoutEl.textContent = step.stdout || '> (Aguardando saída...)';
  }

  // 7. Sincroniza Trace Table
  document.querySelectorAll('.trace-table tbody tr').forEach((tr, rIdx) => {
    if (rIdx === index) {
      tr.classList.add('active-step');
    } else {
      tr.classList.remove('active-step');
    }
  });
}

function prevStep() {
  goToStep(AppState.currentStepIndex - 1);
}

function nextStep() {
  goToStep(AppState.currentStepIndex + 1);
}

def calcular_imc(peso, altura):
    """
    Recebe peso e altura, aplica casting defensivo para float e
    calcula o IMC = peso / (altura ** 2).
    Retorna o valor formatado ou mensagem de erro.
    """
    try:
        peso_val = float(peso)
        altura_val = float(altura)
        imc = peso_val / (altura_val ** 2)
        return f"IMC: {imc:.2f}"
    except (ValueError, TypeError):

function copiarTemplateReforma() {
  const codigoReforma = `# ============================================================
# PYTHONLAB — DESAFIO MESTRE: SIMULADOR DE REFORMA E PINTURA (AULA 1.3)
# Execute esta célula diretamente no Google Colab ou Jupyter Notebook
# Conteúdo permitido: Variáveis, input(), float(), int(),
# Operadores Aritméticos, Precedência com () e Operador Relacional <=
# (Sem uso de funções 'def' e sem condicionais 'if')
#
# Catálogo de insumos da loja:
# - Lata 18L: R$ 87,00 (adotada no cálculo de atacado da pintura)
# - Lata 9L: R$ 45,00 | Galão 2L: R$ 10,00
# - Taxa fixa de materiais (pincéis, rolos, fitas): R$ 45,00
# - Rendimento: 1 litro de tinta cobre 6 m²
# ============================================================

# 1. ENTRADA DE DADOS VIA INPUT() COM TYPE CASTING (FLOAT)
print("=== SIMULADOR DE REFORMA E PINTURA DO LABORATÓRIO ===")
comp = float(input("Digite o comprimento da sala em metros (ex: 8.0): "))
larg = float(input("Digite a largura da sala em metros (ex: 6.0): "))
alt = float(input("Digite a altura/pé-direito das paredes em metros (ex: 3.0): "))
teto_orcamento = float(input("Digite o teto de orçamento da escola em R$ (ex: 200.00): "))

# 2. CÁLCULO DA ÁREA TOTAL DAS 4 PAREDES (PRECEDÊNCIA COM PARÊNTESES)
area_total = 2 * (comp * alt) + 2 * (larg * alt)

# 3. CONSUMO TOTAL DE TINTA (RENDIMENTO: 6 M² POR LITRO)
litros = area_total / 6.0

# 4. DECOMPOSIÇÃO EM LATAS DE 18L (//) E SOBRA AVULSA DE LITROS (%)
latas_cheias = int(litros // 18)
litros_sobra = litros % 18

# 5. CUSTO TOTAL (R$ 87/LATA) E TAXA AUXILIAR COM ATRIBUIÇÃO COMPOSTA (+=)
custo_total = latas_cheias * 87.0
custo_total += 45.0  # Adiciona taxa fixa de materiais auxiliares (R$ 45.00)

# 6. VALIDAÇÃO RELACIONAL DE ORÇAMENTO (BOOLEANO PRODUZIDO SEM IF)
orcamento_ok = custo_total <= teto_orcamento

# 7. SAÍDA FORMATADA NO CONSOLE (STDOUT)
print("\\n--- RELATÓRIO DE CUSTOS E VIABILIDADE ---")
print(f"Área total: {area_total:.1f} m²")
print(f"Litros necessários: {litros:.2f} L")
print(f"Latas cheias (18L): {latas_cheias}")
print(f"Litros avulsos restantes: {litros_sobra:.2f} L")
print(f"Custo com taxa: R$ {custo_total:.2f}")
print(f"Orçamento suficiente: {orcamento_ok}")
`;

  navigator.clipboard.writeText(codigoReforma).then(() => {

function abrirAula(idAula) {
  if (!idAula) idAula = 'aula_1_2';
  AppState.currentLessonId = idAula;

  let stepsAlvo = DEFAULT_SIMULATION_STEPS;
  if (idAula === 'aula_1_4') {
    stepsAlvo = SIMULATION_STEPS_AULA1_4;
  } else if (idAula === 'aula_1_3') {
    stepsAlvo = SIMULATION_STEPS_AULA1_3;
  }
  const tmplId = 'template-' + idAula.replace(/_/g, '-');
  const tmpl = document.getElementById(tmplId);
  const aulaContainer = document.getElementById('dynamic-lesson-content');

  // Troca instantânea SPA em 0ms caso o template esteja no HTML (seja em produção no Apps Script ou no preview local)
  if (tmpl && aulaContainer) {
    aulaContainer.innerHTML = tmpl.innerHTML;
    navigateTo('view-aula');
    const aulaAtual = document.getElementById('view-aula');
    if (aulaAtual) {
      aulaAtual.classList.add('active');
    }
    if (typeof initSimulation === 'function') {
      initSimulation(stepsAlvo);
    }
    aplicarModoVisualizacaoAula(AppState.modoVisualizacaoAula || 'explicacoes', false);
    carregarImagensAula(idAula);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  // Carregamento assíncrono via backend Google Apps Script para aulas dinâmicas futuras
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    showToast('Carregando conteúdo da aula...', 'info');
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.sucesso && res.html) {
          if (aulaContainer) {
            aulaContainer.innerHTML = res.html;
            navigateTo('view-aula');
            const novaSec = document.getElementById('view-aula');
            if (novaSec) {
              novaSec.classList.add('active');
            }
            if (typeof initSimulation === 'function') {
              initSimulation(stepsAlvo);
            }
            aplicarModoVisualizacaoAula(AppState.modoVisualizacaoAula || 'explicacoes', false);
            carregarImagensAula(idAula);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        } else {
          showToast(res ? res.mensagem : 'O arquivo HTML desta aula ainda não foi criado no projeto.', 'info');
        }
      })
      .withFailureHandler(function(err) {
        showToast('Erro ao carregar aula: ' + err.message, 'error');
      })
      .carregarConteudoAula(idAula);
  } else {
    showToast('Esta aula ainda não possui arquivo HTML desenvolvido.', 'info');
  }
}

          loadCatalog();
        } else {
          showToast('Não foi possível identificar seu perfil. Verifique o e-mail digitado.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '🚀 Conectar Perfil';
        }
        showToast('Erro ao conectar: ' + err.message, 'error');
      })
      .getUserSessionData(email);
  } else {
    // Simulação local
    localStorage.setItem('pythonlab_user_email', email);
    onUserSessionSuccess({
      autenticado: true,
      email: email,
      nome: email.split('@')[0],
      perfil: email.includes('prof') ? 'professor' : 'aluno',
      xpTotal: 0,
      progressoIds: ['aula_1_1'],
      duvidasPendentes: [],
      ultimaAulaAcessada: 'aula_1_2',
      podeGravar: true,
      isProfessor: email.includes('prof')
    });
    closeVisitorModal();
    showToast(`Modo Mock: Perfil conectado como ${email}`, 'success');
  }
}

function logoutUsuario() {
  localStorage.removeItem('pythonlab_user_email');
  AppState.user = {

    email: null,
    nome: 'Visitante',

function showToast(message, type = 'info') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = 'toast';
  
  let icon = 'ℹ';
  if (type === 'success') {
    icon = '✓';
    toast.style.backgroundColor = 'var(--color-primary-container)';
  } else if (type === 'error') {
    icon = '✕';
    toast.style.backgroundColor = 'var(--color-error)';
  }

  toast.innerHTML = `<span style="font-weight: bold; font-size: 1.1rem;">${icon}</span> <span>${message}</span>`;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    toast.style.transition = 'all 300ms ease';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

/**
 * ============================================================================
 * BIFURCAÇÃO DIDÁTICA NO TOPO DA AULA (FAST-TRACK VS DEEP-DIVE)
 * ============================================================================
 */
function setModoVisualizacaoAula(modo) {
  AppState.modoVisualizacaoAula = modo;
  try {
    localStorage.setItem('pythonlab_modo_aula', modo);
  } catch (e) {}
  aplicarModoVisualizacaoAula(modo, true);
}

function aplicarModoVisualizacaoAula(modo, scrollar) {
  const blocoExp = document.getElementById('bloco-aula-explicacoes');
  const blocoPra = document.getElementById('bloco-aula-pratica');
  
  const btnExp = document.getElementById('btn-mode-explicacoes');
  const btnPra = document.getElementById('btn-mode-pratica');
  const btnTud = document.getElementById('btn-mode-tudo');
  
  if (btnExp) btnExp.classList.toggle('active', modo === 'explicacoes');
  if (btnPra) btnPra.classList.toggle('active', modo === 'pratica');
  if (btnTud) btnTud.classList.toggle('active', modo === 'tudo');
  
  if (!blocoExp || !blocoPra) return;
  
  if (modo === 'explicacoes') {
    blocoExp.style.display = 'block';
    blocoPra.style.display = 'none';
  } else if (modo === 'pratica') {
    blocoExp.style.display = 'none';
    blocoPra.style.display = 'block';
  } else {
    // 'tudo'
    blocoExp.style.display = 'block';
    blocoPra.style.display = 'block';
  }
  
  if (scrollar) {
    const alvo = (modo === 'pratica') ? blocoPra : blocoExp;
    if (alvo) {
      const topOffset = alvo.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top: topOffset, behavior: 'smooth' });
    }
  }
}

/**
 * ============================================================================
 * IMAGENS DIDÁTICAS DOS EXERCÍCIOS RESOLVIDOS (GOOGLE DRIVE / OPCIONAL)
 * ============================================================================
 */
function carregarImagensAula(idAula) {
  if (!idAula) idAula = AppState.currentLessonId || 'aula_1_2';
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.sucesso) {
          AppState.imagensAula[idAula] = res.imagens || {};
          renderizarSlotsImagens(idAula);
        }
      })
      .withFailureHandler(function(err) {
        console.warn('Aviso ao carregar imagens da aula:', err);
        renderizarSlotsImagens(idAula);
      })
      .obterImagensAula(idAula);
  } else {
    // Local / Preview Mock
    const chaveStorage = 'pythonlab_imagens_' + idAula;
    try {
      const salvas = JSON.parse(localStorage.getItem(chaveStorage) || '{}');
      AppState.imagensAula[idAula] = salvas;
    } catch (e) {
      AppState.imagensAula[idAula] = {};
    }
    renderizarSlotsImagens(idAula);
  }
}

function renderizarSlotsImagens(idAula) {
  if (!idAula) idAula = AppState.currentLessonId || 'aula_1_2';
  const slots = document.querySelectorAll('.exercicio-resolvido-slot[data-aula="' + idAula + '"], .questao-imagem-slot[data-aula="' + idAula + '"]');
  const mapaImgs = AppState.imagensAula[idAula] || {};
  const isProf = AppState.user && (AppState.user.isProfessor || AppState.user.perfil === 'professor');

  slots.forEach(slot => {
    const idEx = slot.getAttribute('data-exercicio');
    const tituloEx = slot.getAttribute('data-titulo') || 'Questão / Exercício';
    const imgData = mapaImgs[idEx];

    if (imgData && imgData.urlVisualizacao) {
      // Exibe a imagem anexada
      const legendaTxt = imgData.legenda ? String(imgData.legenda).replace(/"/g, '&quot;') : '';
      const legendaEnc = encodeURIComponent(imgData.legenda || '');
      let html = `
        <div class="resolvido-img-wrapper">
          <img src="${imgData.urlVisualizacao}" alt="${legendaTxt || 'Imagem Didática da Questão'}" class="resolvido-img" onclick="abrirLightboxImagem('${imgData.urlVisualizacao}', '${legendaEnc}')" title="Clique para ampliar em tela cheia">
          ${imgData.legenda ? `<div class="resolvido-img-caption"><span>📌</span><span>${imgData.legenda}</span></div>` : ''}
          <div class="resolvido-img-actions">
            <button class="btn btn-outline" style="font-size: 0.75rem; padding: 0.25rem 0.6rem;" onclick="abrirLightboxImagem('${imgData.urlVisualizacao}', '${legendaEnc}')">
              🔍 Ampliar Imagem
            </button>
            ${isProf ? `
              <button class="btn btn-outline" style="font-size: 0.75rem; padding: 0.25rem 0.6rem; color: var(--color-secondary);" onclick="abrirModalUploadImagem('${idAula}', '${idEx}', '${encodeURIComponent(tituloEx)}')">
                📷 Alterar Imagem
              </button>
              <button class="btn btn-outline" style="font-size: 0.75rem; padding: 0.25rem 0.6rem; color: #b91c1c; border-color: #fca5a5;" onclick="confirmarRemoverImagemProfessor('${idAula}', '${idEx}')">
                🗑️
              </button>
            ` : ''}
          </div>
        </div>
      `;
      slot.innerHTML = html;
      slot.style.display = 'block';
    } else {
      // Sem imagem: imagens são opcionais
      if (isProf) {
        // Professor vê botão para anexar se desejar
        slot.innerHTML = `
          <div style="text-align: right; margin-top: 0.35rem;">
            <button class="teacher-add-img-btn" onclick="abrirModalUploadImagem('${idAula}', '${idEx}', '${encodeURIComponent(tituloEx)}')">
              <span>📷</span>
              <span>Anexar Imagem [Professor]</span>
            </button>
          </div>
        `;
        slot.style.display = 'block';
      } else {
        // Aluno / Visitante: slot vazio, limpo e invisível
        slot.innerHTML = '';
        slot.style.display = 'none';
      }
    }
  });
}

function abrirModalUploadImagem(idAula, idExercicio, tituloCodificado) {
  const isProf = AppState.user && (AppState.user.isProfessor || AppState.user.perfil === 'professor');
  if (!isProf) {
    showToast('Apenas professores podem gerenciar imagens didáticas.', 'error');
    return;
  }

  const titulo = tituloCodificado ? decodeURIComponent(tituloCodificado) : 'Questão / Exercício';
  AppState.uploadContext = {
    idAula: idAula,
    idExercicio: idExercicio,
    base64Data: null,
    mimeType: null
  };

  const subtituloEl = document.getElementById('modal-img-subtitulo');
  if (subtituloEl) subtituloEl.textContent = `${idAula.toUpperCase()} • ${titulo}`;

  const placeholder = document.getElementById('modal-img-placeholder');
  const previewContainer = document.getElementById('modal-img-preview-container');
  const previewImg = document.getElementById('modal-img-preview');
  const fileInput = document.getElementById('modal-img-file-input');
  const legendaInput = document.getElementById('modal-img-legenda');
  const btnRemover = document.getElementById('btn-remover-img-prof');

  if (fileInput) fileInput.value = '';
  
  const mapaImgs = AppState.imagensAula[idAula] || {};
  const imgAtual = mapaImgs[idExercicio];

  if (imgAtual && imgAtual.urlVisualizacao) {
    if (placeholder) placeholder.style.display = 'none';
    if (previewContainer) previewContainer.style.display = 'block';
    if (previewImg) previewImg.src = imgAtual.urlVisualizacao;
    if (legendaInput) legendaInput.value = imgAtual.legenda || '';
    if (btnRemover) btnRemover.style.display = 'inline-flex';
  } else {
    if (placeholder) placeholder.style.display = 'block';
    if (previewContainer) previewContainer.style.display = 'none';
    if (previewImg) previewImg.src = '';
    if (legendaInput) legendaInput.value = '';
    if (btnRemover) btnRemover.style.display = 'none';
  }

  const modal = document.getElementById('modal-imagem-professor');
  if (modal) modal.classList.add('active');
}

function fecharModalImagemProfessor() {
  const modal = document.getElementById('modal-imagem-professor');
  if (modal) modal.classList.remove('active');
  AppState.uploadContext = null;
}

function aoSelecionarArquivoImagem(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    showToast('A imagem excede o limite máximo de 5 MB.', 'error');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const base64 = e.target.result;
    if (AppState.uploadContext) {
      AppState.uploadContext.base64Data = base64;
      AppState.uploadContext.mimeType = file.type;
    }
    const placeholder = document.getElementById('modal-img-placeholder');
    const previewContainer = document.getElementById('modal-img-preview-container');
    const previewImg = document.getElementById('modal-img-preview');

    if (placeholder) placeholder.style.display = 'none';
    if (previewContainer) previewContainer.style.display = 'block';
    if (previewImg) previewImg.src = base64;
  };
  reader.readAsDataURL(file);
}

function confirmarSalvarImagemProfessor() {
  if (!AppState.uploadContext) return;
  const ctx = AppState.uploadContext;
  const legendaInput = document.getElementById('modal-img-legenda');
  const legenda = legendaInput ? legendaInput.value.trim() : '';

  // Se o professor não escolheu nova imagem e já tinha uma, só atualiza legenda
  const mapaImgs = AppState.imagensAula[ctx.idAula] || {};
  const imgAtual = mapaImgs[ctx.idExercicio];

  if (!ctx.base64Data && (!imgAtual || !imgAtual.urlVisualizacao)) {
    showToast('Por favor, selecione um arquivo de imagem para anexar.', 'info');
    return;
  }

  const btnSalvar = document.getElementById('btn-salvar-img-prof');
  if (btnSalvar) {
    btnSalvar.disabled = true;
    btnSalvar.textContent = 'Enviando ao Drive...';
  }

  showToast('Salvando imagem na pasta imagens do Google Drive...', 'info');

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (btnSalvar) {
          btnSalvar.disabled = false;
          btnSalvar.textContent = '💾 Salvar no Google Drive';
        }
        if (res && res.sucesso && res.imagem) {
          if (!AppState.imagensAula[ctx.idAula]) AppState.imagensAula[ctx.idAula] = {};
          AppState.imagensAula[ctx.idAula][ctx.idExercicio] = res.imagem;
          renderizarSlotsImagens(ctx.idAula);
          fecharModalImagemProfessor();
          showToast('Imagem didática salva com sucesso no Google Drive!', 'success');
        } else {
          showToast(res ? res.mensagem : 'Erro ao salvar imagem.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        if (btnSalvar) {
          btnSalvar.disabled = false;
          btnSalvar.textContent = '💾 Salvar no Google Drive';
        }
        showToast('Erro no upload: ' + err.message, 'error');
      })
      .salvarImagemExercicio({
        idAula: ctx.idAula,
        idExercicio: ctx.idExercicio,
        base64Data: ctx.base64Data || imgAtual.urlVisualizacao,
        mimeType: ctx.mimeType || 'image/png',
        legenda: legenda,
        emailParam: (AppState.user && AppState.user.email) ? AppState.user.email : ''
      });
  } else {
    // Mock local preview
    setTimeout(function() {
      if (btnSalvar) {
        btnSalvar.disabled = false;
        btnSalvar.textContent = '💾 Salvar no Google Drive';
      }
      if (!AppState.imagensAula[ctx.idAula]) AppState.imagensAula[ctx.idAula] = {};
      const novaImg = {
        idImagem: 'img_' + ctx.idAula + '_' + ctx.idExercicio,
        idAula: ctx.idAula,
        idExercicio: ctx.idExercicio,
        driveFileId: 'mock_drive_' + Date.now(),
        urlVisualizacao: ctx.base64Data || (imgAtual ? imgAtual.urlVisualizacao : ''),
        legenda: legenda,
        uploadedBy: (AppState.user && AppState.user.email) ? AppState.user.email : 'professor',
        dataUpload: new Date().toISOString()
      };
      AppState.imagensAula[ctx.idAula][ctx.idExercicio] = novaImg;
      try {
        localStorage.setItem('pythonlab_imagens_' + ctx.idAula, JSON.stringify(AppState.imagensAula[ctx.idAula]));
      } catch (e) {}
      renderizarSlotsImagens(ctx.idAula);
      fecharModalImagemProfessor();
      showToast('Modo Mock: Imagem gravada localmente com sucesso!', 'success');
    }, 600);
  }
}

function confirmarRemoverImagemProfessor(idAula, idExercicio) {
  if (!idAula && AppState.uploadContext) idAula = AppState.uploadContext.idAula;
  if (!idExercicio && AppState.uploadContext) idExercicio = AppState.uploadContext.idExercicio;

  if (!confirm('Deseja realmente remover esta imagem explicativa do exercício?')) {
    return;
  }

  showToast('Removendo imagem...', 'info');

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.sucesso) {
          if (AppState.imagensAula[idAula]) {
            delete AppState.imagensAula[idAula][idExercicio];
          }
          renderizarSlotsImagens(idAula);
          fecharModalImagemProfessor();
          showToast('Imagem removida com sucesso.', 'success');
        } else {
          showToast(res ? res.mensagem : 'Erro ao remover imagem.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        showToast('Erro ao remover: ' + err.message, 'error');
      })
      .removerImagemExercicio({
        idAula: idAula,
        idExercicio: idExercicio,
        emailParam: (AppState.user && AppState.user.email) ? AppState.user.email : ''
      });
  } else {
    // Mock local
    if (AppState.imagensAula[idAula]) {
      delete AppState.imagensAula[idAula][idExercicio];
      try {
        localStorage.setItem('pythonlab_imagens_' + idAula, JSON.stringify(AppState.imagensAula[idAula]));
      } catch (e) {}
    }
    renderizarSlotsImagens(idAula);
    fecharModalImagemProfessor();
    showToast('Modo Mock: Imagem removida localmente.', 'success');
  }
}

function abrirLightboxImagem(url, legendaCodificada) {
  const modal = document.getElementById('modal-lightbox-imagem');
  const imgEl = document.getElementById('lightbox-img-element');
  const capEl = document.getElementById('lightbox-caption-element');

  if (imgEl) imgEl.src = url;
  if (capEl) capEl.textContent = legendaCodificada ? decodeURIComponent(legendaCodificada) : '';
  if (modal) modal.style.display = 'flex';
}

function fecharLightboxImagem() {
  const modal = document.getElementById('modal-lightbox-imagem');
  if (modal) modal.style.display = 'none';
}

// Fechar lightbox no ESC
window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    fecharLightboxImagem();
  }
});
