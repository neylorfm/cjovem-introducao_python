/**
 * Localiza e carrega dinamicamente os passos do simulador CPython encapsulados
 * no próprio HTML da aula ativa (via tag <script type="application/json" class="simulation-steps-data">).
 * Isso garante que o Script.html não infle com centenas de linhas de dados a cada nova aula.
 */
function obterPassosSimulacao(idAula) {
  // 1. Tenta obter diretamente do container da aula ativa no DOM
  const container = document.getElementById('dynamic-lesson-content');
  if (container) {
    const el = container.querySelector('.simulation-steps-data');
    if (el && el.textContent.trim()) {
      try {
        return JSON.parse(el.textContent);
      } catch (e) {
        console.error('Erro ao ler passos de simulação do container:', e);
      }
    }
  }
  // 2. Se a aula ainda estiver apenas no template correspondente
  if (idAula) {
    const tmpl = document.getElementById('template-' + idAula.replace(/_/g, '-'));
    if (tmpl) {
      const el = tmpl.content ? tmpl.content.querySelector('.simulation-steps-data') : tmpl.querySelector('.simulation-steps-data');
      if (el && el.textContent.trim()) {
        try {
          return JSON.parse(el.textContent);
        } catch (e) {
          console.error('Erro ao ler passos de simulação do template:', e);
        }
      }
    }
  }
  return [];
}

function loadUserSession() {
  const savedEmail = localStorage.getItem('pythonlab_user_email') || '';
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(onUserSessionSuccess)
      .withFailureHandler(onUserSessionError)
      .getUserSessionData(savedEmail);
  } else {
    // Modo de Desenvolvimento Local / Preview
    console.info('Executando fora do ambiente Google Apps Script. Ativando mock local.');
    const emailMock = savedEmail || 'professor@institucional';
    const emailLower = emailMock.toLowerCase();
    const isTeacher = emailLower.includes('neylor') || emailLower.includes('prof') || emailLower.includes('admin');

    if (isTeacher) {
      onUserSessionSuccess({
        autenticado: true,
        email: emailMock,
        nome: 'Professor Neylor FM',
        perfil: 'professor',
        xpTotal: 2500,
        progressoIds: ['aula_1_1', 'aula_1_2', 'aula_1_3', 'aula_1_4', 'aula_1_5', 'aula_2_1'],
        exerciciosConcluidos: ['aula_1_2:bloco_a_atv_2', 'aula_1_2:bloco_a_atv_3'],
        ultimoPontoParada: {
          idAula: 'aula_1_2',
          idExercicio: 'bloco_a_atv_3',
          titulo: 'Bloco A: Atividade 3',
          proximoTitulo: 'Bloco A: Atividade 4',
          data: new Date().toISOString()
        },
        duvidasPendentes: [],
        ultimaAulaAcessada: 'aula_1_2',
        podeGravar: true,
        isProfessor: true
      });
    } else {
      const mockData = (typeof mockObterDadosSorteioProfessor === 'function') ? mockObterDadosSorteioProfessor() : { alunos: [] };
      const studentFound = (mockData.alunos || []).find(a => a.email.toLowerCase() === emailLower);
      const nomeAluno = studentFound ? studentFound.nome : (emailMock.split('@')[0].charAt(0).toUpperCase() + emailMock.split('@')[0].slice(1));
      const xpAluno = studentFound ? studentFound.xpTotal : 480;

      onUserSessionSuccess({
        autenticado: true,
        email: emailMock,
        nome: nomeAluno,
        perfil: 'aluno',
        xpTotal: xpAluno,
        progressoIds: ['aula_1_1'],
        exerciciosConcluidos: ['aula_1_2:bloco_a_atv_2', 'aula_1_2:bloco_a_atv_3'],
        ultimoPontoParada: {
          idAula: 'aula_1_2',
          idExercicio: 'bloco_a_atv_3',
          titulo: 'Bloco A: Atividade 3',
          proximoTitulo: 'Bloco A: Atividade 4',
          data: new Date().toISOString()
        },
        duvidasPendentes: [
          {
            idAula: 'aula_1_2',
            idTopico: 'Variáveis e Memória',
            duvida: 'Não entendi por que y continua apontando para 10 no Heap depois que fiz x += 5.',
            data: new Date().toISOString()
          }
        ],
        ultimaAulaAcessada: 'aula_1_2',
        podeGravar: true,
        isProfessor: false
      });
    }
  }
}

function onUserSessionSuccess(userData) {
  AppState.user = userData;
  if (!AppState.user.exerciciosConcluidos) {
    AppState.user.exerciciosConcluidos = [];
  }
  if (userData && userData.autenticado && userData.email) {
    localStorage.setItem('pythonlab_user_email', userData.email);
  }
  renderHeaderUser();
  renderVisitorModalContent();
  renderizarDuvidasDashboard();
  renderizarOndePareiDashboard();
  carregarAvaliacaoAtivaDashboard();
  
  // Se for professor, exibe atalho no menu (desktop e mobile)
  const teacherTabs = document.querySelectorAll('#nav-teacher, #nav-teacher-mobile');
  teacherTabs.forEach(tab => {
    tab.style.display = userData.isProfessor ? (tab.id === 'nav-teacher-mobile' ? 'flex' : 'inline-flex') : 'none';
  });


  // Atualiza modo de visualização, imagens didáticas e checks da aula ativa
  aplicarModoVisualizacaoAula(AppState.modoVisualizacaoAula || 'explicacoes', false);
  carregarImagensAula(AppState.currentLessonId || 'aula_1_2');
  renderizarChecksExercicios(AppState.currentLessonId || 'aula_1_2');
  if (typeof atualizarLabelsNavegacaoAulas === 'function') {
    atualizarLabelsNavegacaoAulas(AppState.currentLessonId || 'aula_1_2');
  }
}

function onUserSessionError(error) {
  console.warn('Erro ao obter sessão:', error);
  showToast('Sessão em modo visitante.', 'info');
  renderVisitorModalContent();
}

function loadCatalog() {
  const currentEmail = (AppState.user && AppState.user.email) ? AppState.user.email : (localStorage.getItem('pythonlab_user_email') || '');
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(onCatalogSuccess)
      .withFailureHandler(function(err) {
        console.warn('Catálogo da planilha indisponível ou em carregamento, utilizando catálogo padrão:', err);
        if (!AppState.catalog || AppState.catalog.length === 0) {
          onCatalogSuccess(COURSES_DATA[AppState.currentCourseId].aulas);
        }
      })
      .getCatalogoAulas(currentEmail);
  } else {
    onCatalogSuccess(COURSES_DATA[AppState.currentCourseId].aulas);
  }
}

function onCatalogSuccess(catalog) {
  if (Array.isArray(catalog) && catalog.length > 0) {
    AppState.catalog = catalog;
  } else if (!AppState.catalog || AppState.catalog.length === 0) {
    AppState.catalog = (typeof COURSES_DATA !== 'undefined' && COURSES_DATA[AppState.currentCourseId]) ? COURSES_DATA[AppState.currentCourseId].aulas : [];
  }
  renderCatalogDashboard(AppState.catalog);
  renderizarOndePareiDashboard();
}

function navigateTo(viewId) {
  // Atualiza classes ativas nos links de navegação (desktop e mobile)
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeBtns = document.querySelectorAll(`.nav-item[data-view="${viewId}"]`);
  activeBtns.forEach(btn => btn.classList.add('active'));

  // Alterna as seções de visualização
  document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
  const targetSec = document.getElementById(viewId);
  if (targetSec) {
    targetSec.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Gerencia visibilidade e monitor de inatividade da barra flutuante
  const floatBar = document.getElementById('floating-lesson-bar');
  if (floatBar) {
    if (viewId === 'view-aula') {
      floatBar.style.display = 'flex';
      floatBar.classList.remove('idle-hidden');
      registrarInteracaoUsuario();
    } else {
      floatBar.style.display = 'none';
      if (_floatingBarIdleTimer) {
        clearTimeout(_floatingBarIdleTimer);
        _floatingBarIdleTimer = null;
      }
    }
  }

  if (viewId === 'view-aula') {
    renderizarChecksExercicios(AppState.currentLessonId || 'aula_1_2');
  } else if (viewId === 'view-dashboard') {
    renderizarOndePareiDashboard();
    carregarAvaliacaoAtivaDashboard();
  }

  // Se a rota for o painel do professor, carrega o relatório consolidado e as avaliações
  if (viewId === 'view-professor') {
    carregarRelatorioProfessor();
    carregarAvaliacoesProfessor();
  }
}

/**
 * ============================================================================
 * CONTROLE DE AUTO-OCULTAÇÃO DA BARRA FLUTUANTE POR INATIVIDADE (3.5s)
 * ============================================================================
 */
let _floatingBarIdleTimer = null;
let _floatingBarIsHovered = false;
let _monitorInatividadeIniciado = false;
const FLOATING_BAR_IDLE_DELAY = 3500; // 3.5 segundos sem interação

function registrarInteracaoUsuario() {
  const bar = document.getElementById('floating-lesson-bar');
  if (!bar) return;

  const viewAula = document.getElementById('view-aula');
  if (!viewAula || !viewAula.classList.contains('active')) return;

  // Garante que a barra esteja visível durante a interação
  bar.classList.remove('idle-hidden');

  if (_floatingBarIdleTimer) {
    clearTimeout(_floatingBarIdleTimer);
    _floatingBarIdleTimer = null;
  }

  // Se o mouse estiver sobre a barra ou se o modal de navegação estiver aberto, não oculta
  const modalQuickNav = document.getElementById('modal-quick-nav');
  if (_floatingBarIsHovered || (modalQuickNav && modalQuickNav.classList.contains('active'))) {
    return;
  }

  // Oculta suavemente após 3.5s sem interação
  _floatingBarIdleTimer = setTimeout(() => {
    const isModalOpen = modalQuickNav && modalQuickNav.classList.contains('active');
    if (!_floatingBarIsHovered && !isModalOpen) {
      bar.classList.add('idle-hidden');
    }
  }, FLOATING_BAR_IDLE_DELAY);
}

function inicializarMonitorInatividadeBarra() {
  if (_monitorInatividadeIniciado) return;
  _monitorInatividadeIniciado = true;

  const bar = document.getElementById('floating-lesson-bar');
  if (bar) {
    bar.addEventListener('mouseenter', () => {
      _floatingBarIsHovered = true;
      bar.classList.remove('idle-hidden');
      if (_floatingBarIdleTimer) {
        clearTimeout(_floatingBarIdleTimer);
        _floatingBarIdleTimer = null;
      }
    });

    bar.addEventListener('mouseleave', () => {
      _floatingBarIsHovered = false;
      registrarInteracaoUsuario();
    });
  }

  // Monitora movimentos do mouse, rolagem, teclado, cliques e toques no celular
  const eventosAtividade = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'];
  eventosAtividade.forEach(evt => {
    window.addEventListener(evt, () => {
      registrarInteracaoUsuario();
    }, { passive: true });
  });

  // Se a tela já for a aula, inicia o ciclo
  registrarInteracaoUsuario();
}

// Inicia imediatamente se o DOM já estiver pronto
if (document.readyState !== 'loading') {
  inicializarMonitorInatividadeBarra();
}

}

function selecionarModuloNoDrawer(modTitle) {
  AppState.quickNavSelectedModule = modTitle;
  renderQuickNavDrawer();
}

function navegarModuloNoDrawer(delta) {
  const currentCourse = COURSES_DATA[AppState.currentCourseId] || COURSES_DATA['curso_logica_python'];
  const modules = [...new Set(currentCourse.aulas.map(a => a.modulo))];
  const curIdx = modules.indexOf(AppState.quickNavSelectedModule);
  const nextIdx = (curIdx === -1 ? 0 : curIdx) + delta;
  if (nextIdx >= 0 && nextIdx < modules.length) {
    AppState.quickNavSelectedModule = modules[nextIdx];
    renderQuickNavDrawer();
  }
}

function abrirMenuNavegacaoRapida() {
  const overlay = document.getElementById('modal-quick-nav');
  if (!overlay) return;

  // Localiza automaticamente o módulo da aula atual para abrir focado nele
  const currentCourse = COURSES_DATA[AppState.currentCourseId] || COURSES_DATA['curso_logica_python'];
  if (AppState.currentLessonId) {
    for (const cId in COURSES_DATA) {
      const aulaAchada = COURSES_DATA[cId].aulas.find(a => a.id_aula === AppState.currentLessonId);
      if (aulaAchada) {
        AppState.currentCourseId = cId;
        AppState.quickNavSelectedModule = aulaAchada.modulo;
        break;
      }
    }
  }

  renderQuickNavDrawer();
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function fecharMenuNavegacaoRapida() {
  const overlay = document.getElementById('modal-quick-nav');
  if (!overlay) return;
  overlay.classList.remove('active');
  document.body.style.overflow = '';
  // Restaura o ciclo de atividade da barra flutuante
  registrarInteracaoUsuario();
}

        const blocoId = (onclickMatch && onclickMatch[1]) ? onclickMatch[1] : idAttr;

/**
 * Abre diretamente uma seção específica de uma aula (Explicações, Bloco ou Desafios)
 * @param {string} idAula - ID da aula
 * @param {string} secaoId - ID da seção/bloco
 * @param {string} [secaoTipo='bloco'] - 'modo' ou 'bloco'
 */
function abrirSecaoAula(idAula, secaoId, secaoTipo = 'bloco') {
  if (AppState.currentLessonId !== idAula) {
    const secaoAlvo = {
      id: secaoId,
      tipo: secaoTipo,
      bloco: secaoId,
      modo: secaoId === 'explicacoes' ? 'explicacoes' : 'pratica'
    };
    abrirAula(idAula, null, secaoAlvo);
  } else {
    if (secaoId === 'explicacoes') {
      setModoVisualizacaoAula('explicacoes');
      AppState.secaoAtiva = 'explicacoes';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (secaoTipo === 'bloco') {
      setModoVisualizacaoAula('pratica');
      switchOficinaBloco(secaoId);
      AppState.secaoAtiva = secaoId;
    } else {
      setModoVisualizacaoAula('pratica');
      AppState.secaoAtiva = secaoId;
      const blocoPra = document.getElementById('bloco-aula-pratica');
      if (blocoPra) blocoPra.scrollIntoView({ behavior: 'smooth' });
    }
    atualizarLabelsNavegacaoAulas(idAula);
  }
}

/**
 * Renderiza o Drawer / Modal de Navegação Rápida com abas de cursos, módulos,
 * aulas e todas as seções e blocos de exercícios diretamente clicáveis.
 */
function renderQuickNavDrawer() {
  const body = document.getElementById('quick-nav-drawer-body');
  if (!body) return;

  const currentCourse = COURSES_DATA[AppState.currentCourseId] || COURSES_DATA['curso_logica_python'];
  const aulas = currentCourse.aulas;

  // 1. Atualiza as abas de curso no topo do drawer
  const drawerTabLogica = document.getElementById('drawer-tab-logica');
  const drawerTabVis = document.getElementById('drawer-tab-vis');
  if (drawerTabLogica) drawerTabLogica.classList.toggle('active', AppState.currentCourseId === 'curso_logica_python');
  if (drawerTabVis) drawerTabVis.classList.toggle('active', AppState.currentCourseId === 'curso_visualizacao_dados');

  // 2. Agrupa aulas do curso ativo por módulo
  const modulesMap = {};
  aulas.forEach(item => {
    if (!modulesMap[item.modulo]) modulesMap[item.modulo] = [];
    modulesMap[item.modulo].push(item);
  });

  const moduleNames = Object.keys(modulesMap);
  if (moduleNames.length === 0) {
    body.innerHTML = '<p style="text-align: center; color: var(--color-outline); padding: 1.5rem;">Nenhum módulo encontrado.</p>';
    return;
  }

  // 3. Define o módulo ativo (1 módulo por vez para garantir todas as aulas 100% visíveis)
  if (!AppState.quickNavSelectedModule || !modulesMap[AppState.quickNavSelectedModule]) {
    const aulaAtiva = aulas.find(a => a.id_aula === AppState.currentLessonId);
    AppState.quickNavSelectedModule = aulaAtiva ? aulaAtiva.modulo : moduleNames[0];
  }

  const activeModTitle = AppState.quickNavSelectedModule;
  const activeModIndex = moduleNames.indexOf(activeModTitle);
  const currentModLessons = modulesMap[activeModTitle] || [];

  // 4. Constrói a Barra de Abas de Módulos
  let tabsHtml = '<div class="quick-nav-modules-tabs-bar" role="tablist">';
  moduleNames.forEach((modName) => {
    const isActive = modName === activeModTitle;
    let label = modName;
    if (modName.includes(':')) {
      label = modName.split(':')[0].trim();
    } else if (modName.startsWith('Módulo de')) {
      label = 'Módulo Único';
    }
    const count = modulesMap[modName].length;
    tabsHtml += `
      <button class="quick-nav-mod-tab-btn ${isActive ? 'active' : ''}" 
              onclick="selecionarModuloNoDrawer('${modName.replace(/'/g, "\\'")}')" 
              title="${modName}">
        <span>📦 ${label}</span>
        <span style="opacity: 0.85; font-size: 0.7rem;">(${count})</span>
      </button>
    `;
  });
  tabsHtml += '</div>';

  // 5. Cabeçalho do Módulo Selecionado com Navegação Rápida
  const hasPrev = activeModIndex > 0;
  const hasNext = activeModIndex < moduleNames.length - 1;
  const headerHtml = `
    <div class="quick-nav-active-module-header">
      <div class="quick-nav-mod-info">
        <span class="quick-nav-mod-title" title="${activeModTitle}">📦 ${activeModTitle}</span>
        <span class="quick-nav-mod-count">${currentModLessons.length} aulas</span>
      </div>
      <div class="quick-nav-mod-actions">
        <button class="quick-nav-mod-nav-btn" onclick="navegarModuloNoDrawer(-1)" ${!hasPrev ? 'disabled' : ''} title="Módulo Anterior">◀</button>
        <span class="quick-nav-mod-nav-indicator">${activeModIndex + 1} / ${moduleNames.length}</span>
        <button class="quick-nav-mod-nav-btn" onclick="navegarModuloNoDrawer(1)" ${!hasNext ? 'disabled' : ''} title="Próximo Módulo">▶</button>
      </div>
    </div>
  `;

  // 6. Lista de Aulas e suas Seções (Todas as seções visíveis e acessíveis diretamente)
  let listHtml = '<div class="quick-nav-lessons-container">';
  currentModLessons.forEach(lesson => {
    const isCurrent = lesson.id_aula === AppState.currentLessonId;
    const isConcluded = AppState.user.progressoIds && AppState.user.progressoIds.includes(lesson.id_aula);

    let statusPill = '';
    if (isCurrent) {
      statusPill = '<span class="quick-nav-lesson-pill" style="background: #dbeafe; color: #1e40af;">▶ Em Estudo</span>';
    } else if (isConcluded) {
      statusPill = '<span class="quick-nav-lesson-pill" style="background: #dcfce7; color: #166534;">✔ Concluído</span>';
    } else if (lesson.status === 'rascunho') {
      statusPill = '<span class="quick-nav-lesson-pill" style="background: #f1f5f9; color: #64748b;">Rascunho</span>';
    } else {
      statusPill = '<span class="quick-nav-lesson-pill" style="background: #e0f2fe; color: #0284c7;">Disponível</span>';
    }

    // Seções pedagógicas e blocos de exercícios da aula
    const secoes = obterSecoesAula(lesson.id_aula);
    let secoesHtml = '';
    if (secoes && secoes.length > 0) {
      secoesHtml = '<div class="quick-nav-sections-grid">';
      secoes.forEach(sec => {
        const isSecActive = isCurrent && (
          (sec.tipo === 'modo' && (AppState.secaoAtiva === sec.id || (!AppState.secaoAtiva && AppState.modoVisualizacaoAula === sec.modo))) ||
          (sec.tipo === 'bloco' && AppState.secaoAtiva === sec.bloco)
        );
        let secLabel = sec.titulo;
        if (secLabel.startsWith('1. Explicações')) secLabel = '1. Explicações';
        else if (secLabel.startsWith('2. Exercícios')) secLabel = '2. Exercícios';

        secoesHtml += `
          <button class="quick-nav-sec-chip ${isSecActive ? 'active-sec' : ''}" 
                  onclick="event.stopPropagation(); abrirSecaoAula('${lesson.id_aula}', '${sec.id}', '${sec.tipo}'); fecharMenuNavegacaoRapida();"
                  title="Ir para ${sec.titulo} da Aula ${lesson.numero}">
            <span>${sec.icone} ${secLabel}</span>
            ${isSecActive ? '<span class="quick-nav-sec-active-dot">●</span>' : ''}
          </button>
        `;
      });
      secoesHtml += '</div>';
    }

    listHtml += `
      <div class="quick-nav-lesson-card ${isCurrent ? 'current-lesson-card' : ''}">
        <div class="quick-nav-lesson-row ${isCurrent ? 'current-lesson' : ''}" 
             onclick="abrirAula('${lesson.id_aula}'); fecharMenuNavegacaoRapida();"
             title="Abrir Aula ${lesson.numero}: ${lesson.titulo}">
          <div class="quick-nav-row-main">
            <span class="quick-nav-row-num">Aula ${lesson.numero || ''}</span>
            <span class="quick-nav-row-title">${lesson.titulo}</span>
          </div>
          <div class="quick-nav-row-badge">
            ${statusPill}
          </div>
        </div>
        ${secoesHtml}
      </div>
    `;
  });
  listHtml += '</div>';

  // 7. Rodapé Stepper de Navegação entre Seções dentro da Modal
  const secoesAtuais = obterSecoesAula(AppState.currentLessonId);
  let curSecIdx = secoesAtuais.findIndex(s => s.id === AppState.secaoAtiva || s.bloco === AppState.secaoAtiva);
  if (curSecIdx === -1) {
    curSecIdx = (AppState.modoVisualizacaoAula === 'pratica' && secoesAtuais.length > 1) ? 1 : 0;
  }
  const secAtualObj = secoesAtuais[curSecIdx] || secoesAtuais[0];
  const aulaAtualObj = aulas.find(a => a.id_aula === AppState.currentLessonId) || aulas[0];
  const secLabel = secAtualObj ? (secAtualObj.id === 'explicacoes' ? 'Teoria' : secAtualObj.titulo.replace(/^[🏆🎯]\s*/, '')) : 'Seção';
  const stepperBadge = `Aula ${aulaAtualObj ? aulaAtualObj.numero : '1.2'} • ${secLabel}`;

  const currentAulaIdx = aulas.findIndex(a => a.id_aula === AppState.currentLessonId);
  const isFirstEver = currentAulaIdx <= 0 && curSecIdx <= 0;
  const isLastEver = currentAulaIdx >= aulas.length - 1 && curSecIdx >= secoesAtuais.length - 1;

  const stepperHtml = `
    <div class="quick-nav-stepper-bar">
      <button class="quick-nav-step-btn" onclick="navegarSecaoRelativa(-1);" ${isFirstEver ? 'disabled' : ''} title="${isFirstEver ? 'Início do Curso' : 'Ir para a seção anterior'}">
        <span>◀ Anterior</span>
      </button>
      <div class="quick-nav-step-info">
        <span class="quick-nav-step-sub">Seção Selecionada</span>
        <span class="quick-nav-step-current" title="${stepperBadge}">${stepperBadge}</span>
      </div>
      <button class="quick-nav-step-btn primary" onclick="navegarSecaoRelativa(1);" ${isLastEver ? 'disabled' : ''} title="${isLastEver ? 'Fim do Curso' : 'Ir para a próxima seção'}">
        <span>Próxima ▶</span>
      </button>
    </div>
  `;

  body.innerHTML = tabsHtml + headerHtml + listHtml + stepperHtml;
}

/**
 * Navega passo a passo entre as seções da aula (Explicações -> Bloco A -> Bloco B -> Bloco C -> Desafios).
 * Ao chegar no Desafio, avançar muda para a próxima aula.
 * Ao estar em Explicações, retroceder volta para a aula anterior.
 * @param {number} delta - (-1 para Anterior, +1 para Próxima)
 */
function navegarSecaoRelativa(delta) {
  const currentCourse = COURSES_DATA[AppState.currentCourseId] || COURSES_DATA['curso_logica_python'];
  const aulas = currentCourse.aulas;
  const currentAulaIdx = aulas.findIndex(a => a.id_aula === AppState.currentLessonId);
  if (currentAulaIdx === -1) return;

  const secoes = obterSecoesAula(AppState.currentLessonId);
  let curSecIdx = secoes.findIndex(s => s.id === AppState.secaoAtiva || s.bloco === AppState.secaoAtiva);
  if (curSecIdx === -1) {
    curSecIdx = (AppState.modoVisualizacaoAula === 'pratica' && secoes.length > 1) ? 1 : 0;
  }

  const targetSecIdx = curSecIdx + delta;

  // CASO 1: Navegação dentro da mesma aula
  if (targetSecIdx >= 0 && targetSecIdx < secoes.length) {
    const targetSec = secoes[targetSecIdx];
    AppState.secaoAtiva = targetSec.id;

    if (targetSec.tipo === 'modo' && targetSec.modo === 'explicacoes') {
      setModoVisualizacaoAula('explicacoes');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (targetSec.tipo === 'bloco') {
      setModoVisualizacaoAula('pratica');
      switchOficinaBloco(targetSec.bloco);
    } else if (targetSec.tipo === 'modo' && targetSec.modo === 'pratica') {
      setModoVisualizacaoAula('pratica');
      const blocoPratica = document.getElementById('bloco-aula-pratica');
      if (blocoPratica) {
        blocoPratica.scrollIntoView({ behavior: 'smooth' });
      }
    }

    atualizarLabelsNavegacaoAulas(AppState.currentLessonId);
    showToast(`📍 ${targetSec.titulo}`, 'info');
    if (document.getElementById('modal-quick-nav')?.classList.contains('active')) {
      renderQuickNavDrawer();
    }
    return;
  }

  // CASO 2: Anterior ultrapassou o início da aula -> volta para a aula anterior (na sua última seção)
  if (targetSecIdx < 0) {
    const prevAulaIdx = currentAulaIdx - 1;
    if (prevAulaIdx >= 0) {
      const prevAula = aulas[prevAulaIdx];
      const prevSecoes = obterSecoesAula(prevAula.id_aula);
      const lastSec = (prevSecoes && prevSecoes.length > 0) ? prevSecoes[prevSecoes.length - 1] : null;
      abrirAula(prevAula.id_aula, null, lastSec);
      showToast(`⏮️ Aula ${prevAula.numero}: ${lastSec ? lastSec.titulo : 'Conclusão'}`, 'info');
    } else {
      showToast('Você já está na primeira seção da primeira aula deste curso.', 'info');
    }
    return;
  }

  // CASO 3: Próximo ultrapassou o final da aula -> avança para a próxima aula (na primeira seção: Explicações)
  if (targetSecIdx >= secoes.length) {
    const nextAulaIdx = currentAulaIdx + 1;
    if (nextAulaIdx < aulas.length) {
      const nextAula = aulas[nextAulaIdx];
      const nextSecoes = obterSecoesAula(nextAula.id_aula);
      const firstSec = (nextSecoes && nextSecoes.length > 0) ? nextSecoes[0] : null;
      abrirAula(nextAula.id_aula, null, firstSec);
      showToast(`⏭️ Aula ${nextAula.numero}: 1. Explicações & Fundamentos`, 'success');
    } else {
      showToast('Parabéns! Você alcançou o final do curso. 🎉', 'success');
    }
    return;
  }
}

// Mantido como alias de navegarSecaoRelativa para compatibilidade total
function navegarAulaRelativa(delta) {
  navegarSecaoRelativa(delta);
}

/**
 * Atualiza os rótulos de navegação no cabeçalho fixo, na barra flutuante e no drawer
 * @param {string} idAula - ID da aula ativa
 */
function atualizarLabelsNavegacaoAulas(idAula) {
  if (!idAula) idAula = AppState.currentLessonId || 'aula_1_2';
  const currentCourse = COURSES_DATA[AppState.currentCourseId] || COURSES_DATA['curso_logica_python'];
  const aulas = currentCourse.aulas;
  const currentIndex = aulas.findIndex(a => a.id_aula === idAula);
  const aulaAtual = currentIndex !== -1 ? aulas[currentIndex] : null;
  if (!aulaAtual) return;

  const secoes = obterSecoesAula(idAula);
  let curSecIdx = secoes.findIndex(s => s.id === AppState.secaoAtiva || s.bloco === AppState.secaoAtiva);
  if (curSecIdx === -1) {
    curSecIdx = (AppState.modoVisualizacaoAula === 'pratica' && secoes.length > 1) ? 1 : 0;
    AppState.secaoAtiva = secoes[curSecIdx].id;
  }
  const secAtual = secoes[curSecIdx] || secoes[0];

  // 1. Rótulo no cabeçalho fixo do topo
  const headerLabel = document.getElementById('header-quick-nav-label');
  if (headerLabel) {
    const secShort = secAtual.id === 'explicacoes' ? 'Teoria' : secAtual.titulo.replace(/^[🏆🎯]\s*/, '').split(':')[0].trim();
    headerLabel.textContent = `Aula ${aulaAtual.numero} • ${secShort}`;
  }

  // 2. Badge na barra flutuante
  const floatingBadge = document.getElementById('floating-lesson-badge');
  if (floatingBadge) {
    let badgeText = `Aula ${aulaAtual.numero}`;
    if (secAtual.id === 'explicacoes') {
      badgeText += ` • Teoria`;
    } else {
      const nomeSec = secAtual.titulo.replace(/^[🏆🎯]\s*/, '').trim();
      badgeText += ` • ${nomeSec}`;
    }
    floatingBadge.textContent = badgeText;
  }

  // 3. Botões de Anterior / Próxima na barra flutuante
  const btnPrev = document.getElementById('btn-floating-prev');
  const btnNext = document.getElementById('btn-floating-next');

  if (btnPrev) {
    if (curSecIdx > 0) {
      const prevSec = secoes[curSecIdx - 1];
      btnPrev.disabled = false;
      btnPrev.style.opacity = '1';
      btnPrev.title = `Voltar para: ${prevSec.titulo}`;
    } else if (currentIndex > 0) {
      const prevAula = aulas[currentIndex - 1];
      btnPrev.disabled = false;
      btnPrev.style.opacity = '1';
      btnPrev.title = `Voltar para Aula ${prevAula.numero} (Desafio Mestre)`;
    } else {
      btnPrev.disabled = true;
      btnPrev.style.opacity = '0.4';
      btnPrev.title = 'Início do Curso';
    }
  }

  if (btnNext) {
    if (curSecIdx < secoes.length - 1) {
      const nextSec = secoes[curSecIdx + 1];
      btnNext.disabled = false;
      btnNext.style.opacity = '1';
      btnNext.title = `Avançar para: ${nextSec.titulo}`;
    } else if (currentIndex < aulas.length - 1) {
      const nextAula = aulas[currentIndex + 1];
      btnNext.disabled = false;
      btnNext.style.opacity = '1';
      btnNext.title = `Avançar para Aula ${nextAula.numero} (1. Explicações & Fundamentos)`;
    } else {
      btnNext.disabled = true;
      btnNext.style.opacity = '0.4';
      btnNext.title = 'Fim do Curso';
    }
  }
}

/**
 * Alterna expansão e contração de um módulo da trilha (ocupando 1 linha quando contraído)
 */
function toggleModuloAccordion(modTitle, safeModId) {
  if (!AppState.modulosExpandidos) AppState.modulosExpandidos = {};
  AppState.modulosExpandidos[modTitle] = !AppState.modulosExpandidos[modTitle];
  const isOpen = !!AppState.modulosExpandidos[modTitle];

  const card = document.getElementById('card-' + safeModId);
  const body = document.getElementById('body-' + safeModId);
  const chevron = document.getElementById('chevron-' + safeModId);
  const hint = document.getElementById('hint-' + safeModId);

  if (card) {
    card.classList.toggle('expanded', isOpen);
    card.classList.toggle('collapsed', !isOpen);
  }
  if (body) {
    body.style.display = isOpen ? 'block' : 'none';
  }
  if (chevron) {
    chevron.classList.toggle('rotated', isOpen);
  }
  if (hint) {
    hint.textContent = isOpen ? 'Recolher' : 'Expandir';
  }
}

/**
 * ============================================================================
 * MOTOR DO SIMULADOR PASSO A PASSO & RASTREIO DE MEMÓRIA
 * ============================================================================
 */

function initSimulation(steps) {
  AppState.simulationSteps = steps;
  AppState.currentStepIndex = 0;
  renderStepperButtons();
  goToStep(0);
}

function renderStepperButtons() {
  const container = document.getElementById('step-buttons-container');
  if (!container) return;

  let html = '';
  AppState.simulationSteps.forEach((s, idx) => {
    html += `
      <button class="btn btn-outline step-btn-pill" id="step-pill-${idx}" style="padding: 0.25rem 0.65rem; min-width: 2rem; font-size: 0.8rem;" onclick="goToStep(${idx})">
        ${idx}
      </button>
    `;
  });
  container.innerHTML = html;
}

function goToStep(index) {
  if (index < 0 || index >= AppState.simulationSteps.length) return;
  AppState.currentStepIndex = index;
  const step = AppState.simulationSteps[index];

  // 1. Atualiza botões de navegação
  const btnPrev = document.getElementById('btn-step-prev');
  const btnNext = document.getElementById('btn-step-next');
  if (btnPrev) btnPrev.disabled = (index === 0);
  if (btnNext) btnNext.disabled = (index === AppState.simulationSteps.length - 1);

  // Destaque visual dos botões numéricos
  document.querySelectorAll('.step-btn-pill').forEach(btn => {
    btn.style.backgroundColor = 'transparent';
    btn.style.color = 'var(--color-on-surface)';
    btn.style.borderColor = 'var(--color-outline-variant)';
  });
  const activePill = document.getElementById(`step-pill-${index}`);
  if (activePill) {
    activePill.style.backgroundColor = 'var(--color-primary)';
    activePill.style.color = '#ffffff';
    activePill.style.borderColor = 'var(--color-primary)';
    try {
      activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    } catch (e) {}
  }

  // 2. Destaque da linha de código ativa
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  const targetCodeLine = document.getElementById(`code-line-${step.line}`);
  if (targetCodeLine) targetCodeLine.classList.add('active');

  // 3. Atualiza Insight Card Didático
  const titleEl = document.getElementById('insight-title');
  const descEl = document.getElementById('insight-desc');
  if (titleEl) titleEl.textContent = step.insightTitle;
  if (descEl) descEl.textContent = step.insightDesc;

  // 4. Renderiza Call Stack
  const stackContainer = document.getElementById('stack-frame-vars');
  if (stackContainer) {
    if (step.stack.length === 0) {
      stackContainer.innerHTML = '<div style="font-size: 0.8rem; color: var(--color-outline); padding: 0.5rem 0;">(Nenhuma variável no escopo local)</div>';
    } else {
      let stackHtml = '';
      step.stack.forEach(v => {
        stackHtml += `
          <div class="memory-box updated">
            <div>
              <div class="memory-var-name">${v.name}</div>
              <div class="memory-var-desc">${v.type}</div>
            </div>
            <div class="memory-pointer-badge">
              <span>${v.addr}</span>
              <span>→</span>
            </div>
          </div>
        `;
      });
      stackContainer.innerHTML = stackHtml;
    }
  }

  // 5. Renderiza Heap Space
  const heapContainer = document.getElementById('heap-objects-grid');
  if (heapContainer) {
    if (step.heap.length === 0) {
      heapContainer.innerHTML = '<div style="font-size: 0.8rem; color: var(--color-outline); padding: 0.5rem 0;">(Nenhum objeto alocado no Heap)</div>';
    } else {
      let heapHtml = '';
      step.heap.forEach(obj => {
        heapHtml += `
          <div class="heap-object-cell">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="heap-addr">${obj.addr}</span>
              <span class="heap-type-badge">${obj.type}</span>
            </div>
            <div class="heap-val">${obj.val}</div>
          </div>
        `;
      });
      heapContainer.innerHTML = heapHtml;
    }
  }

  // 6. Atualiza Terminal Stdout
  const stdoutEl = document.getElementById('terminal-stdout-output');
  if (stdoutEl) {
    stdoutEl.textContent = step.stdout || '> (Aguardando saída...)';
  }

  // 7. Sincroniza Trace Table
  document.querySelectorAll('.trace-table tbody tr').forEach((tr, rIdx) => {
    if (rIdx === index) {
      tr.classList.add('active-step');
    } else {
      tr.classList.remove('active-step');
    }
  });
}

function prevStep() {
  goToStep(AppState.currentStepIndex - 1);
}

function nextStep() {
  goToStep(AppState.currentStepIndex + 1);
}

/**
 * Alternância de abas do Caderno de Oficinas (Blocos A, B e C ou Seções 1 a 5 e Desafios)
 * Permite navegação instantânea mantendo a barra sticky sempre visível e acessível
 */
function switchOficinaBloco(blocoId) {
  AppState.secaoAtiva = blocoId;
  AppState.modoVisualizacaoAula = 'pratica';
  if (typeof aplicarModoVisualizacaoAula === 'function') {
    aplicarModoVisualizacaoAula('pratica', false);
  }
  const todasAbas = ['bloco-a', 'bloco-b', 'bloco-c', 'secao-1', 'secao-2', 'secao-3', 'secao-4', 'secao-5', 'desafios'];
  todasAbas.forEach(id => {
    const btns = document.querySelectorAll(`[id="btn-tab-${id}"]`);
    const panel = document.getElementById(`panel-${id}`);
    btns.forEach(btn => {
      if (id === blocoId) {
        btn.classList.remove('btn-outline');
        btn.classList.add('btn-primary', 'active');
        // Assegura que o botão fique visível no scroll horizontal
        if (btn.scrollIntoViewIfNeeded) {
          btn.scrollIntoViewIfNeeded();
        }
      } else {
        btn.classList.remove('btn-primary', 'active');
        btn.classList.add('btn-outline');
      }
    });
    if (panel) {
      panel.style.display = (id === blocoId) ? 'block' : 'none';
    }
  });

  // Atualiza indicadores da barra flutuante e do drawer
  atualizarLabelsNavegacaoAulas(AppState.currentLessonId);
  const modalQuickNav = document.getElementById('modal-quick-nav');
  if (modalQuickNav && modalQuickNav.classList.contains('active')) {
    renderQuickNavDrawer();
  }

  // Rolagem suave para o topo do painel de exercícios mantendo o menu sticky perfeitamente visível
  const stickyBar = document.getElementById('treinamento-gradual-sticky') || document.querySelector('.treinamento-sticky-bar');
  if (stickyBar) {
    const isMobile = window.innerWidth <= 768;
    const headerHeight = isMobile ? 56 : 104;
    const targetOffset = stickyBar.getBoundingClientRect().top + window.scrollY - headerHeight - 8;
    if (window.scrollY > targetOffset) {
      window.scrollTo({ top: Math.max(0, targetOffset), behavior: 'smooth' });
    }
  }
}

/**
 * Alterna expansão/recolhimento dos detalhes da barra Treinamento Gradual (mantendo-a em 1 linha por padrão)
 */
function toggleTreinamentoDetalhes() {
  const body = document.getElementById('treinamento-detalhes-body');
  const icon = document.getElementById('icon-treinamento-detalhes');
  const text = document.getElementById('text-treinamento-detalhes');
  if (!body) return;

/**
 * Copia o texto de código de qualquer elemento da tela diretamente para a área de transferência
 * @param {string} elementoId - ID do elemento HTML que contém o código
 * @param {string} [mensagemSucesso] - Mensagem personalizada exibida no Toast
 */
function copiarCodigo(elementoId, mensagemSucesso = 'Código copiado com sucesso!') {
  const el = document.getElementById(elementoId);
  if (!el) {
    showToast('Elemento de código não encontrado para cópia.', 'error');
    return;
  }
  const texto = el.innerText || el.textContent;
  if (!texto || !texto.trim()) {
    showToast('Nenhum código disponível para copiar.', 'info');
    return;
  }
  navigator.clipboard.writeText(texto.trim()).then(() => {
    showToast(mensagemSucesso, 'success');
  }).catch(() => {
    prompt('Copie o código abaixo:', texto.trim());
  });
}

/**
 * Alterna a visibilidade de qualquer gabarito/solução comentada e inverte o ícone indicador
 * @param {string} bodyId - ID do elemento container do gabarito
 * @param {string} [iconId] - ID do ícone indicador (ex: ▼ / ▲). Opcional se seguir o padrão id + '-icon'
 */
function toggleGabarito(bodyId = 'gabarito-body', iconId = null) {
  const body = document.getElementById(bodyId);
  if (!body) return;
  const isHidden = (body.style.display === 'none' || body.style.display === '');
  body.style.display = isHidden ? 'block' : 'none';

  const icon = iconId ? document.getElementById(iconId) : document.getElementById(bodyId.replace(/-body$/, '') + '-icon');
  if (icon) {
    icon.textContent = isHidden ? '▲' : '▼';
  }
}

/**
 * Alterna a visibilidade de instruções ou detalhes de solução de atividades
 * @param {string} id - ID do container da solução/instruções
 * @param {HTMLElement|string} [btnRef] - Referência opcional do botão disparador
 */
function toggleSolucao(id, btnRef) {
  const el = document.getElementById(id);
  if (!el) return;
  const isHidden = (el.style.display === 'none' || el.style.display === '' || getComputedStyle(el).display === 'none');
  el.style.display = isHidden ? 'block' : 'none';

  const btn = (typeof btnRef === 'string') ? document.getElementById(btnRef) : (btnRef || (window.event ? (window.event.currentTarget || window.event.target) : null));
  if (btn) {
    btn.classList.toggle('active', isHidden);
    const arrow = btn.querySelector('.toggle-arrow') || btn.querySelector('.arrow-indicator');
    if (arrow) {
      arrow.textContent = isHidden ? '▲' : '▼';
    }
  }
}

/**
 * Validação genérica de checklist conceitual (habilita botão de homologação quando todos estiverem marcados)
 * @param {string} prefixo - Prefixo dos IDs dos checkboxes (ex: 'totem', 'reforma', 'monitoria')
 * @param {number} [total=4] - Quantidade total de checkboxes do grupo
 * @param {string} [btnId] - ID do botão a ser habilitado (se nulo, usa `btn-concluir-${prefixo}`)
 */
function atualizarChecklist(prefixo, total = 4, btnId = null) {
  const targetBtnId = btnId || `btn-concluir-${prefixo}`;
  const btn = document.getElementById(targetBtnId);
  let todosConcluidos = true;

  for (let i = 1; i <= total; i++) {
    const chk = document.getElementById(`chk-${prefixo}-${i}`);
    if (chk && !chk.checked) {
      todosConcluidos = false;
      break;
    }
  }

  if (btn) {
    btn.disabled = !todosConcluidos;
    btn.style.opacity = todosConcluidos ? '1' : '0.5';
    btn.style.cursor = todosConcluidos ? 'pointer' : 'not-allowed';
  }
}

/**
 * Validação universal e homologação de XP para Desafios Mestres
 * @param {string} idExercicio - Identificador da atividade (ex: 'desafio_mestre_reforma')
 * @param {string} tituloDesafio - Nome amigável da atividade para o Toast de feedback

  if (typeof google !== 'undefined' && google.script && google.script.run) {

function alternarConclusaoExercicio(idAula, idExercicio, tituloEnc, xp, checkboxEl) {
  const user = AppState.user;
  const titulo = decodeURIComponent(tituloEnc || 'Atividade');

  // Regra de Negócio: Visitante não grava na planilha
  if (!user || user.perfil === 'visitante' || !user.autenticado) {
    if (checkboxEl) checkboxEl.checked = false;
    openVisitorModal();
    showToast('🔒 Faça login ou cadastre-se para marcar exercícios concluídos e salvar seu progresso!', 'info');
    return;
  }

  if (!AppState.user.exerciciosConcluidos) {
    AppState.user.exerciciosConcluidos = [];
  }

  const chave = idAula + ':' + idExercicio;
  const isMarcando = checkboxEl ? checkboxEl.checked : (AppState.user.exerciciosConcluidos.indexOf(chave) === -1);
  const xpDelta = isMarcando ? Number(xp) : -Number(xp);

  if (isMarcando) {
    if (AppState.user.exerciciosConcluidos.indexOf(chave) === -1) {
      AppState.user.exerciciosConcluidos.push(chave);
    }
    AppState.user.xpTotal += Number(xp);
    showToast(`✓ Atividade "${titulo}" concluída! +${xp} XP`, 'success');
  } else {
    AppState.user.exerciciosConcluidos = AppState.user.exerciciosConcluidos.filter(function(c) { return c !== chave; });
    AppState.user.xpTotal = Math.max(0, AppState.user.xpTotal - Number(xp));
    showToast(`Atividade desmarcada (-${xp} XP)`, 'info');
  }

  renderHeaderUser();
  renderizarChecksExercicios(idAula);
    atualizarLabelsNavegacaoAulas(idAula);
  renderizarOndePareiDashboard();

  const novoStatus = isMarcando ? 'concluido' : 'em_andamento';
  if (typeof google !== 'undefined' && google.script && google.script.run && user.email) {
    google.script.run
      .withSuccessHandler(function(resp) {
        if (!resp || !resp.sucesso) {
          showToast(resp ? resp.mensagem : 'Erro ao sincronizar progresso.', 'info');
        }
      })
      .withFailureHandler(function(err) {
        showToast('Erro ao salvar no Sheets: ' + err.message, 'error');
      })
      .salvarProgresso(idAula, idExercicio, novoStatus, false, true, false, xpDelta, titulo, user.email);
  }
}

function obterExercicioMaisAdiantado(idAula) {
  if (!idAula) idAula = AppState.currentLessonId || 'aula_1_2';
  const concluidos = (AppState.user && AppState.user.exerciciosConcluidos) ? AppState.user.exerciciosConcluidos : [];

  const slots = Array.from(document.querySelectorAll(
    '.exercicio-resolvido-slot[data-aula="' + idAula + '"], .questao-imagem-slot[data-aula="' + idAula + '"],' +
    '.exercicio-resolvido-slot[data-img-aula="' + idAula + '"], .questao-imagem-slot[data-img-aula="' + idAula + '"]'
  ));

  let maisAdiantadoSlot = null;
  let proximoSlot = null;

  for (let i = 0; i < slots.length; i++) {
    const s = slots[i];
    const idEx = s.getAttribute('data-exercicio') || s.getAttribute('data-img-exercicio');
    if (concluidos.indexOf(idAula + ':' + idEx) !== -1) {
      maisAdiantadoSlot = s;
      proximoSlot = slots[i + 1] || null;
    }
  }

  if (maisAdiantadoSlot) {
    const idEx = maisAdiantadoSlot.getAttribute('data-exercicio') || maisAdiantadoSlot.getAttribute('data-img-exercicio');
    return {
      idAula: idAula,
      idExercicio: idEx,
      titulo: maisAdiantadoSlot.getAttribute('data-titulo') || idEx,
      proximoTitulo: proximoSlot ? (proximoSlot.getAttribute('data-titulo') || proximoSlot.getAttribute('data-exercicio')) : null
    };
  }
  return null;
}

function definirPontoParadaManual(idAula, idExercicio, tituloEnc) {
  const user = AppState.user;
  const titulo = decodeURIComponent(tituloEnc || idExercicio);

  if (!user || user.perfil === 'visitante' || !user.autenticado) {
    openVisitorModal();
    showToast('🔒 Faça login ou cadastre-se para salvar seu ponto de parada!', 'info');
    return;
  }

  const pontoAtual = AppState.user.ultimoPontoParada;
  const jaEraPonto = pontoAtual && pontoAtual.idAula === idAula && pontoAtual.idExercicio === idExercicio;

  if (jaEraPonto) {
    // Alterna para desmarcar: exatamente 0 botões com estado 'Parou aqui'
    AppState.user.ultimoPontoParada = null;
    showToast(`📍 Ponto de parada desmarcado.`, 'info');
  } else {
    // Define como o ÚNICO ponto de parada ativo no sistema
    AppState.user.ultimoPontoParada = {
      idAula: idAula,
      idExercicio: idExercicio,
      titulo: titulo,
      data: new Date().toISOString()
    };
    AppState.user.ultimaAulaAcessada = idAula;
    showToast(`📍 Você parou aqui: "${titulo}"!`, 'success');
  }

  // Atualiza imediatamente todos os botões e cards na página - garantindo rigorosamente apenas 1 ativo
  renderizarChecksExercicios(idAula);
    atualizarLabelsNavegacaoAulas(idAula);
  renderizarOndePareiDashboard();

  if (typeof google !== 'undefined' && google.script && google.script.run && user.email) {
    const idParaSalvar = jaEraPonto ? '' : idExercicio;
    google.script.run.salvarProgresso(idAula, 'ponto_parada', 'em_andamento', false, false, false, 0, idParaSalvar, user.email);
  }
}

function rolarParaExercicio(idExercicio) {
  if (!idExercicio) return;

  setTimeout(function() {
    const el = document.getElementById('slot-img-' + idExercicio) ||
               document.getElementById('footer-ex-' + idExercicio) ||
               document.querySelector('[data-exercicio="' + idExercicio + '"]');
    if (!el) {
      console.warn('Exercício não encontrado no DOM:', idExercicio);
      return;
    }

    const blocoPra = document.getElementById('bloco-aula-pratica');
    if (blocoPra && (blocoPra.style.display === 'none' || getComputedStyle(blocoPra).display === 'none')) {
      aplicarModoVisualizacaoAula('pratica', false);
    }

    const panel = el.closest('.oficina-panel');
    if (panel && panel.id) {
      const tabId = panel.id.replace(/^panel-/, '');
      if (typeof switchOficinaBloco === 'function') {
        switchOficinaBloco(tabId);
      }
    }

    const cardAlvo = el.closest('.card') || el.parentElement || el;
    cardAlvo.scrollIntoView({ behavior: 'smooth', block: 'center' });

    cardAlvo.classList.add('ponto-parada-destaque');
    setTimeout(function() {
      cardAlvo.classList.remove('ponto-parada-destaque');
    }, 3600);
  }, 220);
}

function abrirAula(idAula, idExercicioParaRolar, secaoInicial) {
  if (!idAula) idAula = 'aula_1_2';
  AppState.currentLessonId = idAula;

  const currentCourse = COURSES_DATA[AppState.currentCourseId] || COURSES_DATA['curso_logica_python'];
  const aulaObj = currentCourse.aulas.find(a => a.id_aula === idAula);
  if (aulaObj) {
    AppState.quickNavSelectedModule = aulaObj.modulo;
  }

  const tmplId = 'template-' + idAula.replace(/_/g, '-');
  const tmpl = document.getElementById(tmplId);
  const aulaContainer = document.getElementById('dynamic-lesson-content');

  const finalizarAbertura = function() {
    navigateTo('view-aula');
    const aulaAtual = document.getElementById('view-aula');
    if (aulaAtual) {
      aulaAtual.classList.add('active');
    }
    const stepsAlvo = obterPassosSimulacao(idAula);
    if (typeof initSimulation === 'function') {
      initSimulation(stepsAlvo);
    }

    if (secaoInicial) {
      if (secaoInicial.tipo === 'modo' && secaoInicial.modo === 'explicacoes') {
        AppState.secaoAtiva = 'explicacoes';
        AppState.modoVisualizacaoAula = 'explicacoes';
        aplicarModoVisualizacaoAula('explicacoes', false);
      } else if (secaoInicial.tipo === 'bloco') {
        AppState.secaoAtiva = secaoInicial.bloco;
        AppState.modoVisualizacaoAula = 'pratica';
        aplicarModoVisualizacaoAula('pratica', false);
        switchOficinaBloco(secaoInicial.bloco);
      } else if (secaoInicial.tipo === 'modo' && secaoInicial.modo === 'pratica') {
        AppState.secaoAtiva = 'pratica';
        AppState.modoVisualizacaoAula = 'pratica';
        aplicarModoVisualizacaoAula('pratica', false);
      }
    } else {
      AppState.secaoAtiva = 'explicacoes';
      aplicarModoVisualizacaoAula(AppState.modoVisualizacaoAula || 'explicacoes', false);
    }

    carregarImagensAula(idAula);
    renderizarChecksExercicios(idAula);
    atualizarLabelsNavegacaoAulas(idAula);

    if (document.getElementById('modal-quick-nav')?.classList.contains('active')) {
      renderQuickNavDrawer();
    }

    if (idExercicioParaRolar) {
      rolarParaExercicio(idExercicioParaRolar);
    } else if (secaoInicial && secaoInicial.tipo === 'bloco') {
      const stickyBar = document.getElementById('treinamento-gradual-sticky') || document.querySelector('.treinamento-sticky-bar');
      if (stickyBar) {
        const offset = stickyBar.getBoundingClientRect().top + window.scrollY - 80;
        window.scrollTo({ top: Math.max(0, offset), behavior: 'smooth' });
      }
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  // Troca instantânea SPA em 0ms caso o template esteja no HTML (seja em produção no Apps Script ou no preview local)
  if (tmpl && aulaContainer) {
    aulaContainer.innerHTML = tmpl.innerHTML;
    finalizarAbertura();
    return;
  }

  // Carregamento assíncrono via backend Google Apps Script para aulas dinâmicas futuras
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    showToast('Carregando conteúdo da aula...', 'info');
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.sucesso && res.html) {
          if (aulaContainer) {
            aulaContainer.innerHTML = res.html;
            finalizarAbertura();
          }
        } else {
          showToast(res ? res.mensagem : 'O arquivo HTML desta aula ainda não foi criado no projeto.', 'info');
        }
      })
      .withFailureHandler(function(err) {
        showToast('Erro ao carregar aula: ' + err.message, 'error');
      })
      .carregarConteudoAula(idAula);
  } else {
    showToast('Esta aula ainda não possui arquivo HTML desenvolvido.', 'info');
  }
}

let _avaliacaoAtivaAtual = null;
let _arquivoAvaliacaoSelecionado = null;

function carregarAvaliacaoAtivaDashboard() {
  const card = document.getElementById('dash-avaliacao-card');
  if (!card) return;

  // Configura drag-and-drop na dropzone uma única vez
  const dropzone = document.getElementById('dash-eval-dropzone');
  if (dropzone && !dropzone._dragInitialized) {
    dropzone._dragInitialized = true;
    ['dragenter', 'dragover'].forEach(function(evt) {
      dropzone.addEventListener(evt, function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropzone.style.borderColor = 'var(--color-primary)';
        dropzone.style.backgroundColor = 'var(--color-surface-low)';
      });
    });
    ['dragleave', 'drop'].forEach(function(evt) {
      dropzone.addEventListener(evt, function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropzone.style.borderColor = 'var(--color-outline-variant)';
        dropzone.style.backgroundColor = 'var(--color-surface-lowest)';
      });
    });
    dropzone.addEventListener('drop', function(e) {
      var dt = e.dataTransfer;
      var files = dt && dt.files;
      if (files && files.length > 0) {
        aoSelecionarArquivoAvaliacao({ target: { files: files } });
      }
    });
  }

  const emailAluno = (AppState.user && AppState.user.email) ? AppState.user.email : '';

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(renderAvaliacaoAtivaDashboard)
      .withFailureHandler(function(err) {
        console.warn('Erro ao obter avaliação ativa:', err);
      })
      .obterAvaliacaoAtiva(emailAluno);
  } else {
    // Modo Mock Local / Preview
    const mockAtiva = {
      sucesso: true,
      ativa: {
        id_avaliacao: 'eval_mock_1',
        nome: 'Prova 1 - Estruturas de Decisão',
        status: 'ativa',
        pasta_drive_url: '#'
      },
      jaEnviou: false,
      envioAluno: null
    };
    renderAvaliacaoAtivaDashboard(mockAtiva);
  }
}

function renderAvaliacaoAtivaDashboard(res) {
  const card = document.getElementById('dash-avaliacao-card');
  if (!card) return;

  if (!res || !res.sucesso || !res.ativa) {
    card.style.display = 'none';
    _avaliacaoAtivaAtual = null;
    return;
  }

  _avaliacaoAtivaAtual = res;
  card.style.display = 'block';

  // Título da Avaliação
  const tituloEl = document.getElementById('dash-eval-titulo');
  if (tituloEl) {
    tituloEl.textContent = res.ativa.nome || 'Avaliação Prática';
  }

  const badgeStatus = document.getElementById('dash-eval-status-badge');
  const boxEnviado = document.getElementById('dash-eval-enviado-box');
  const nomeArquivoEnviado = document.getElementById('dash-eval-arquivo-enviado-nome');
  const dataArquivoEnviado = document.getElementById('dash-eval-arquivo-enviado-data');
  const linkArquivoEnviado = document.getElementById('dash-eval-arquivo-enviado-link');
  const hintEl = document.getElementById('dash-eval-upload-hint');
  const btnEnviar = document.getElementById('btn-enviar-avaliacao');

  // Reset da seleção de arquivo
  _arquivoAvaliacaoSelecionado = null;
  const fileInput = document.getElementById('dash-eval-file-input');
  if (fileInput) fileInput.value = '';
  const placeholder = document.getElementById('dash-eval-placeholder');
  const fileSelected = document.getElementById('dash-eval-file-selected');
  if (placeholder) placeholder.style.display = 'block';
  if (fileSelected) fileSelected.style.display = 'none';
  if (btnEnviar) {
    btnEnviar.disabled = true;
  }

  if (res.jaEnviou && res.envioAluno) {
    // Aluno já enviou anteriormente
    if (badgeStatus) {
      badgeStatus.textContent = '✅ Solução Enviada';
      badgeStatus.style.color = '#15803d';
    }
    if (boxEnviado) boxEnviado.style.display = 'block';
    if (nomeArquivoEnviado) {
      nomeArquivoEnviado.textContent = res.envioAluno.nome_arquivo_drive || 'Arquivo enviado';
    }
    if (dataArquivoEnviado) {
      const dataFormatada = res.envioAluno.data_envio 
        ? new Date(res.envioAluno.data_envio).toLocaleString('pt-BR') 
        : '—';
      dataArquivoEnviado.textContent = 'Enviado em: ' + dataFormatada;
    }
    if (linkArquivoEnviado) {
      if (res.envioAluno.drive_file_url) {
        linkArquivoEnviado.href = res.envioAluno.drive_file_url;
        linkArquivoEnviado.style.display = 'inline-flex';
      } else {
        linkArquivoEnviado.style.display = 'none';
      }
    }
    if (btnEnviar) {
      btnEnviar.textContent = '🔄 Reenviar Resolução (Substituir)';
    }
    if (hintEl) {
      hintEl.textContent = 'Atenção: reenviar substituirá sua solução anterior no Google Drive.';
    }
  } else {
    // Primeiro envio
    if (badgeStatus) {
      badgeStatus.textContent = '⏳ Pendente de Envio';
      badgeStatus.style.color = '#b45309';
    }
    if (boxEnviado) boxEnviado.style.display = 'none';
    if (btnEnviar) {
      btnEnviar.textContent = '🚀 Enviar Resolução da Prova';
    }
    if (hintEl) {
      hintEl.textContent = 'Certifique-se de que o notebook está salvo antes de enviar.';
    }
  }
}

function aoSelecionarArquivoAvaliacao(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const nome = file.name || '';
  const ext = nome.split('.').pop().toLowerCase();

  if (ext !== 'ipynb' && ext !== 'py') {
    showToast('Formato não aceito. Selecione apenas arquivos .ipynb ou .py', 'error');
    event.target.value = '';
    return;
  }

  if (file.size > 25 * 1024 * 1024) {
    showToast('O arquivo selecionado é muito grande. O limite máximo é de 25MB.', 'warning');
    event.target.value = '';
    return;
  }

  _arquivoAvaliacaoSelecionado = file;

  const placeholder = document.getElementById('dash-eval-placeholder');
  const fileSelected = document.getElementById('dash-eval-file-selected');
  const nameEl = document.getElementById('dash-eval-selected-filename');
  const sizeEl = document.getElementById('dash-eval-selected-filesize');
  const btnEnviar = document.getElementById('btn-enviar-avaliacao');

  if (placeholder) placeholder.style.display = 'none';
  if (fileSelected) fileSelected.style.display = 'block';
  if (nameEl) nameEl.textContent = file.name;
  if (sizeEl) {
    const kb = (file.size / 1024).toFixed(1);
    sizeEl.textContent = `${kb} KB (${ext === 'py' ? 'Script Python' : 'Jupyter Notebook'})`;
  }
  if (btnEnviar) {
    btnEnviar.disabled = false;
  }
}

function solicitarEnvioAvaliacaoAluno() {
  if (!_arquivoAvaliacaoSelecionado) {
    showToast('Por favor, selecione um arquivo .ipynb ou .py primeiro.', 'warning');
    return;
  }

  if (!_avaliacaoAtivaAtual || !_avaliacaoAtivaAtual.ativa) {
    showToast('Nenhuma avaliação ativa encontrada no momento.', 'warning');
    return;
  }

  if (!AppState.user || !AppState.user.email) {
    showToast('Faça login com seu e-mail para enviar a prova.', 'warning');
    openVisitorModal();
    return;
  }

  // Se o aluno já enviou, abre modal de confirmação de substituição formativa
  if (_avaliacaoAtivaAtual.jaEnviou) {
    const modal = document.getElementById('modal-confirmar-substituicao-aluno');
    const nomeAntigoEl = document.getElementById('substituir-modal-arquivo-antigo');
    if (nomeAntigoEl && _avaliacaoAtivaAtual.envioAluno) {
      nomeAntigoEl.textContent = _avaliacaoAtivaAtual.envioAluno.nome_arquivo_drive || 'Arquivo anterior';
    }
    if (modal) {
      modal.classList.add('active');
      modal.style.display = 'flex';
    }
    return;
  }

  // Primeiro envio direto
  executarEnvioComSubstituicao(false);
}

function executarEnvioComSubstituicao(isSubstituicao) {
  if (!_arquivoAvaliacaoSelecionado || !_avaliacaoAtivaAtual || !_avaliacaoAtivaAtual.ativa) {
    fecharModalSubstituicaoAluno();
    return;
  }

  const btnEnviar = document.getElementById('btn-enviar-avaliacao');
  const btnSubst = document.getElementById('btn-confirmar-substituicao');
  if (btnEnviar) {
    btnEnviar.disabled = true;
    btnEnviar.textContent = '⏳ Enviando ao Drive...';
  }
  if (btnSubst) {
    btnSubst.disabled = true;
    btnSubst.textContent = '⏳ Gravando no Drive...';
  }

  const file = _arquivoAvaliacaoSelecionado;
  const reader = new FileReader();

  reader.onload = function(e) {
    const base64Data = e.target.result;
    const payload = {
      idAvaliacao: _avaliacaoAtivaAtual.ativa.id_avaliacao,
      emailAluno: (AppState.user && AppState.user.email) ? AppState.user.email : '',
      nomeAluno: (AppState.user && AppState.user.nome) ? AppState.user.nome : '',
      nomeOriginalArquivo: file.name,
      base64Data: base64Data,
      mimeType: file.type || '',
      tamanhoBytes: file.size
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          fecharModalSubstituicaoAluno();
          if (btnSubst) {
            btnSubst.disabled = false;
            btnSubst.textContent = 'Sim, Substituir Arquivo';
          }
          if (btnEnviar) {
            btnEnviar.disabled = false;
            btnEnviar.textContent = '🚀 Enviar Resolução da Prova';
          }
          if (res && res.sucesso) {
            showToast(res.mensagem || 'Prova enviada com sucesso ao Google Drive!', 'success');
            carregarAvaliacaoAtivaDashboard();
          } else {
            showToast((res && res.mensagem) ? res.mensagem : 'Erro ao enviar arquivo.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          fecharModalSubstituicaoAluno();
          if (btnSubst) {
            btnSubst.disabled = false;
            btnSubst.textContent = 'Sim, Substituir Arquivo';
          }
          if (btnEnviar) {
            btnEnviar.disabled = false;
            btnEnviar.textContent = '🚀 Enviar Resolução da Prova';
          }
          showToast('Erro de comunicação com o servidor: ' + (err.message || err), 'error');
        })
        .enviarArquivoAvaliacao(payload);
    } else {
      // Mock local
      setTimeout(function() {
        fecharModalSubstituicaoAluno();
        if (btnSubst) {
          btnSubst.disabled = false;
          btnSubst.textContent = 'Sim, Substituir Arquivo';
        }
        if (btnEnviar) {
          btnEnviar.disabled = false;
          btnEnviar.textContent = '🚀 Enviar Resolução da Prova';
        }
        showToast('Mock: Prova enviada com sucesso!', 'success');
        _avaliacaoAtivaAtual.jaEnviou = true;
        _avaliacaoAtivaAtual.envioAluno = {
          nome_arquivo_drive: 'Prova_Mock_' + file.name,
          data_envio: new Date().toISOString(),
          drive_file_url: '#'
        };
        renderAvaliacaoAtivaDashboard(_avaliacaoAtivaAtual);
      }, 800);
    }
  };

  reader.onerror = function() {
    fecharModalSubstituicaoAluno();
    if (btnSubst) btnSubst.disabled = false;
    if (btnEnviar) btnEnviar.disabled = false;
    showToast('Falha ao ler o arquivo local.', 'error');
  };

  reader.readAsDataURL(file);
}
