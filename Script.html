function showToast(message, type = 'info') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = 'toast';
  
  let icon = 'ℹ';
  if (type === 'success') {
    icon = '✓';
    toast.style.backgroundColor = 'var(--color-primary-container)';
  } else if (type === 'error') {
    icon = '✕';
    toast.style.backgroundColor = 'var(--color-error)';
  }

  toast.innerHTML = `<span style="font-weight: bold; font-size: 1.1rem;">${icon}</span> <span>${message}</span>`;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    toast.style.transition = 'all 300ms ease';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

/**
 * ============================================================================
 * BIFURCAÇÃO DIDÁTICA NO TOPO DA AULA (FAST-TRACK VS DEEP-DIVE)
 * ============================================================================
 */
function setModoVisualizacaoAula(modo) {
  AppState.modoVisualizacaoAula = modo;
  try {
    localStorage.setItem('pythonlab_modo_aula', modo);
  } catch (e) {}

  if (modo === 'explicacoes') {
    AppState.secaoAtiva = 'explicacoes';
  } else if (modo === 'pratica') {
    if (!AppState.secaoAtiva || AppState.secaoAtiva === 'explicacoes') {
      const secoes = (typeof obterSecoesAula === 'function') ? obterSecoesAula(AppState.currentLessonId) : [];
      if (secoes.length > 1 && secoes[1].tipo === 'bloco') {
        AppState.secaoAtiva = secoes[1].bloco;
        if (typeof switchOficinaBloco === 'function') {
          switchOficinaBloco(secoes[1].bloco);
        }
      } else {
        AppState.secaoAtiva = 'pratica';
      }
    }
  }

  aplicarModoVisualizacaoAula(modo, true);
  if (typeof atualizarLabelsNavegacaoAulas === 'function') {
    atualizarLabelsNavegacaoAulas(AppState.currentLessonId);
  }
}

function aplicarModoVisualizacaoAula(modo, scrollar) {
  const blocoExp = document.getElementById('bloco-aula-explicacoes');
  const blocoPra = document.getElementById('bloco-aula-pratica');
  
  const btnExp = document.getElementById('btn-mode-explicacoes');
  const btnPra = document.getElementById('btn-mode-pratica');
  const btnTud = document.getElementById('btn-mode-tudo');
  
  if (btnExp) btnExp.classList.toggle('active', modo === 'explicacoes');
  if (btnPra) btnPra.classList.toggle('active', modo === 'pratica');
  if (btnTud) btnTud.classList.toggle('active', modo === 'tudo');
  
  if (!blocoExp || !blocoPra) return;
  
  if (modo === 'explicacoes') {
    blocoExp.style.display = 'block';
    blocoPra.style.display = 'none';
  } else if (modo === 'pratica') {
    blocoExp.style.display = 'none';
    blocoPra.style.display = 'block';
  } else {
    // 'tudo'
    blocoExp.style.display = 'block';
    blocoPra.style.display = 'block';
  }
  
  if (scrollar) {
    const alvo = (modo === 'pratica') ? blocoPra : blocoExp;
    if (alvo) {
      const topOffset = alvo.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top: topOffset, behavior: 'smooth' });
    }
  }
}

/**
 * ============================================================================
 * IMAGENS DIDÁTICAS DOS EXERCÍCIOS RESOLVIDOS (GOOGLE DRIVE / OPCIONAL)
 * ============================================================================
 */
function carregarImagensAula(idAula) {
  if (!idAula) idAula = AppState.currentLessonId || 'aula_1_2';
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.sucesso) {
          AppState.imagensAula[idAula] = res.imagens || {};
          renderizarSlotsImagens(idAula);
        }
      })
      .withFailureHandler(function(err) {
        console.warn('Aviso ao carregar imagens da aula:', err);
        renderizarSlotsImagens(idAula);
      })
      .obterImagensAula(idAula);
  } else {
    // Local / Preview Mock
    const chaveStorage = 'pythonlab_imagens_' + idAula;
    try {
      const salvas = JSON.parse(localStorage.getItem(chaveStorage) || '{}');
      AppState.imagensAula[idAula] = salvas;
    } catch (e) {
      AppState.imagensAula[idAula] = {};
    }
    renderizarSlotsImagens(idAula);
  }
}

function renderizarSlotsImagens(idAula) {
  if (!idAula) idAula = AppState.currentLessonId || 'aula_1_2';
  const slots = document.querySelectorAll(
    '.exercicio-resolvido-slot[data-aula="' + idAula + '"], .questao-imagem-slot[data-aula="' + idAula + '"],' +
    '.exercicio-resolvido-slot[data-img-aula="' + idAula + '"], .questao-imagem-slot[data-img-aula="' + idAula + '"]'
  );
  const mapaImgs = AppState.imagensAula[idAula] || {};
  const isProf = AppState.user && (AppState.user.isProfessor || AppState.user.perfil === 'professor');

  slots.forEach(slot => {
    const idEx = slot.getAttribute('data-exercicio') || slot.getAttribute('data-img-exercicio');
    const tituloEx = slot.getAttribute('data-titulo') || 'Questão / Exercício';
    
    // Busca direta pelo id, ou com/sem o prefixo canônico da aula (ex: aula_X_Y_)
    const prefixo = idAula + '_';
    const idExSemPrefixo = (idEx && idEx.startsWith(prefixo)) ? idEx.slice(prefixo.length) : idEx;
    const idExComPrefixo = (idEx && idEx.startsWith(prefixo)) ? idEx : (prefixo + idEx);
    const imgData = mapaImgs[idEx] || mapaImgs[idExSemPrefixo] || mapaImgs[idExComPrefixo];

    if (imgData && imgData.urlVisualizacao) {
      // Exibe a imagem anexada
      const legendaTxt = imgData.legenda ? String(imgData.legenda).replace(/"/g, '&quot;') : '';
      const legendaEnc = encodeURIComponent(imgData.legenda || '');
      let html = `
        <div class="resolvido-img-wrapper">
          <img src="${imgData.urlVisualizacao}" alt="${legendaTxt || 'Imagem Didática da Questão'}" class="resolvido-img" onclick="abrirLightboxImagem('${imgData.urlVisualizacao}', '${legendaEnc}')" title="Clique para ampliar em tela cheia">
          ${imgData.legenda ? `<div class="resolvido-img-caption"><span>📌</span><span>${imgData.legenda}</span></div>` : ''}
          <div class="resolvido-img-actions">
            <button class="btn btn-outline" style="font-size: 0.75rem; padding: 0.25rem 0.6rem;" onclick="abrirLightboxImagem('${imgData.urlVisualizacao}', '${legendaEnc}')">
              🔍 Ampliar Imagem
            </button>
            ${isProf ? `
              <button class="btn btn-outline" style="font-size: 0.75rem; padding: 0.25rem 0.6rem; color: var(--color-secondary);" onclick="abrirModalUploadImagem('${idAula}', '${idEx}', '${encodeURIComponent(tituloEx)}')">
                📷 Alterar Imagem
              </button>
              <button class="btn btn-outline" style="font-size: 0.75rem; padding: 0.25rem 0.6rem; color: #b91c1c; border-color: #fca5a5;" onclick="confirmarRemoverImagemProfessor('${idAula}', '${idEx}')">
                🗑️
              </button>
            ` : ''}
          </div>
        </div>
      `;
      slot.innerHTML = html;
      slot.style.display = 'block';
    } else {
      // Sem imagem: imagens são opcionais
      if (isProf) {
        // Professor vê botão para anexar se desejar
        slot.innerHTML = `
          <div style="text-align: right; margin-top: 0.35rem;">
            <button class="teacher-add-img-btn" onclick="abrirModalUploadImagem('${idAula}', '${idEx}', '${encodeURIComponent(tituloEx)}')">
              <span>📷</span>
              <span>Anexar Imagem [Professor]</span>
            </button>
          </div>
        `;
        slot.style.display = 'block';
      } else {
        // Aluno / Visitante: slot vazio, limpo e invisível
        slot.innerHTML = '';
        slot.style.display = 'none';
      }
    }
  });
}

function abrirModalUploadImagem(idAula, idExercicio, tituloCodificado) {
  const isProf = AppState.user && (AppState.user.isProfessor || AppState.user.perfil === 'professor');
  if (!isProf) {
    showToast('Apenas professores podem gerenciar imagens didáticas.', 'error');
    return;
  }

  const titulo = tituloCodificado ? decodeURIComponent(tituloCodificado) : 'Questão / Exercício';
  AppState.uploadContext = {
    idAula: idAula,
    idExercicio: idExercicio,
    base64Data: null,
    mimeType: null
  };

  const subtituloEl = document.getElementById('modal-img-subtitulo');
  if (subtituloEl) subtituloEl.textContent = `${idAula.toUpperCase()} • ${titulo}`;

  const placeholder = document.getElementById('modal-img-placeholder');
  const previewContainer = document.getElementById('modal-img-preview-container');
  const previewImg = document.getElementById('modal-img-preview');
  const fileInput = document.getElementById('modal-img-file-input');
  const legendaInput = document.getElementById('modal-img-legenda');
  const btnRemover = document.getElementById('btn-remover-img-prof');

  if (fileInput) fileInput.value = '';
  
  const mapaImgs = AppState.imagensAula[idAula] || {};
  const imgAtual = mapaImgs[idExercicio];

  if (imgAtual && imgAtual.urlVisualizacao) {
    if (placeholder) placeholder.style.display = 'none';
    if (previewContainer) previewContainer.style.display = 'block';
    if (previewImg) previewImg.src = imgAtual.urlVisualizacao;
    if (legendaInput) legendaInput.value = imgAtual.legenda || '';
    if (btnRemover) btnRemover.style.display = 'inline-flex';
  } else {
    if (placeholder) placeholder.style.display = 'block';
    if (previewContainer) previewContainer.style.display = 'none';
    if (previewImg) previewImg.src = '';
    if (legendaInput) legendaInput.value = '';
    if (btnRemover) btnRemover.style.display = 'none';
  }

  const modal = document.getElementById('modal-imagem-professor');
  if (modal) modal.classList.add('active');
}

function fecharModalImagemProfessor() {
  const modal = document.getElementById('modal-imagem-professor');
  if (modal) modal.classList.remove('active');
  AppState.uploadContext = null;
}

function aoSelecionarArquivoImagem(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    showToast('A imagem excede o limite máximo de 5 MB.', 'error');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const base64 = e.target.result;
    if (AppState.uploadContext) {
      AppState.uploadContext.base64Data = base64;
      AppState.uploadContext.mimeType = file.type;
    }
    const placeholder = document.getElementById('modal-img-placeholder');
    const previewContainer = document.getElementById('modal-img-preview-container');
    const previewImg = document.getElementById('modal-img-preview');

    if (placeholder) placeholder.style.display = 'none';
    if (previewContainer) previewContainer.style.display = 'block';
    if (previewImg) previewImg.src = base64;
  };
  reader.readAsDataURL(file);
}

function confirmarSalvarImagemProfessor() {
  if (!AppState.uploadContext) return;
  const ctx = AppState.uploadContext;
  const legendaInput = document.getElementById('modal-img-legenda');
  const legenda = legendaInput ? legendaInput.value.trim() : '';

  // Se o professor não escolheu nova imagem e já tinha uma, só atualiza legenda
  const mapaImgs = AppState.imagensAula[ctx.idAula] || {};
  const imgAtual = mapaImgs[ctx.idExercicio];

  if (!ctx.base64Data && (!imgAtual || !imgAtual.urlVisualizacao)) {
    showToast('Por favor, selecione um arquivo de imagem para anexar.', 'info');
    return;
  }

  const btnSalvar = document.getElementById('btn-salvar-img-prof');
  if (btnSalvar) {
    btnSalvar.disabled = true;
    btnSalvar.textContent = 'Enviando ao Drive...';
  }

  showToast('Salvando imagem na pasta imagens do Google Drive...', 'info');

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (btnSalvar) {
          btnSalvar.disabled = false;
          btnSalvar.textContent = '💾 Salvar no Google Drive';
        }
        if (res && res.sucesso && res.imagem) {
          if (!AppState.imagensAula[ctx.idAula]) AppState.imagensAula[ctx.idAula] = {};
          AppState.imagensAula[ctx.idAula][ctx.idExercicio] = res.imagem;
          renderizarSlotsImagens(ctx.idAula);
          fecharModalImagemProfessor();
          showToast('Imagem didática salva com sucesso no Google Drive!', 'success');
        } else {
          showToast(res ? res.mensagem : 'Erro ao salvar imagem.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        if (btnSalvar) {
          btnSalvar.disabled = false;
          btnSalvar.textContent = '💾 Salvar no Google Drive';
        }
        showToast('Erro no upload: ' + err.message, 'error');
      })
      .salvarImagemExercicio({
        idAula: ctx.idAula,
        idExercicio: ctx.idExercicio,
        base64Data: ctx.base64Data || imgAtual.urlVisualizacao,
        mimeType: ctx.mimeType || 'image/png',
        legenda: legenda,
        emailParam: (AppState.user && AppState.user.email) ? AppState.user.email : ''
      });
  } else {
    // Mock local preview
    setTimeout(function() {
      if (btnSalvar) {
        btnSalvar.disabled = false;
        btnSalvar.textContent = '💾 Salvar no Google Drive';
      }
      if (!AppState.imagensAula[ctx.idAula]) AppState.imagensAula[ctx.idAula] = {};
      const novaImg = {
        idImagem: 'img_' + ctx.idAula + '_' + ctx.idExercicio,
        idAula: ctx.idAula,
        idExercicio: ctx.idExercicio,
        driveFileId: 'mock_drive_' + Date.now(),
        urlVisualizacao: ctx.base64Data || (imgAtual ? imgAtual.urlVisualizacao : ''),
        legenda: legenda,
        uploadedBy: (AppState.user && AppState.user.email) ? AppState.user.email : 'professor',
        dataUpload: new Date().toISOString()
      };
      AppState.imagensAula[ctx.idAula][ctx.idExercicio] = novaImg;
      try {
        localStorage.setItem('pythonlab_imagens_' + ctx.idAula, JSON.stringify(AppState.imagensAula[ctx.idAula]));
      } catch (e) {}
      renderizarSlotsImagens(ctx.idAula);
      fecharModalImagemProfessor();
      showToast('Modo Mock: Imagem gravada localmente com sucesso!', 'success');
    }, 600);
  }
}

function confirmarRemoverImagemProfessor(idAula, idExercicio) {
  if (!idAula && AppState.uploadContext) idAula = AppState.uploadContext.idAula;
  if (!idExercicio && AppState.uploadContext) idExercicio = AppState.uploadContext.idExercicio;

  if (!confirm('Deseja realmente remover esta imagem explicativa do exercício?')) {
    return;
  }

  showToast('Removendo imagem...', 'info');

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.sucesso) {
          if (AppState.imagensAula[idAula]) {
            delete AppState.imagensAula[idAula][idExercicio];
          }
          renderizarSlotsImagens(idAula);
          fecharModalImagemProfessor();
          showToast('Imagem removida com sucesso.', 'success');
        } else {
          showToast(res ? res.mensagem : 'Erro ao remover imagem.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        showToast('Erro ao remover: ' + err.message, 'error');
      })
      .removerImagemExercicio({
        idAula: idAula,
        idExercicio: idExercicio,
        emailParam: (AppState.user && AppState.user.email) ? AppState.user.email : ''
      });
  } else {
    // Mock local
    if (AppState.imagensAula[idAula]) {
      delete AppState.imagensAula[idAula][idExercicio];
      try {
        localStorage.setItem('pythonlab_imagens_' + idAula, JSON.stringify(AppState.imagensAula[idAula]));
      } catch (e) {}
    }
    renderizarSlotsImagens(idAula);
    fecharModalImagemProfessor();
    showToast('Modo Mock: Imagem removida localmente.', 'success');
  }
}

function abrirLightboxImagem(url, legendaCodificada) {
  const modal = document.getElementById('modal-lightbox-imagem');
  const imgEl = document.getElementById('lightbox-img-element');
  const capEl = document.getElementById('lightbox-caption-element');

  if (imgEl) imgEl.src = url;
  if (capEl) capEl.textContent = legendaCodificada ? decodeURIComponent(legendaCodificada) : '';
  if (modal) modal.style.display = 'flex';
}

function fecharLightboxImagem() {
  const modal = document.getElementById('modal-lightbox-imagem');
  if (modal) modal.style.display = 'none';
}

// Fechar lightbox no ESC
window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    fecharLightboxImagem();
  }
});

/**
 * ============================================================================
 * INICIALIZAÇÃO RESILIENTE E UNIFICADA DA APLICAÇÃO (PYTHONLAB SPA)
 * ============================================================================
 * Executa após todas as constantes (COURSES_DATA), modelos e funções estarem prontas.
 * Dispara de imediato se o DOM já estiver pronto (iframe GAS) ou no DOMContentLoaded.
 */
function inicializarPythonLab() {
  try {
    // 1. Renderização Instantânea do Catálogo (Zero Latência / Elimina "Carregando módulos...")
    if (typeof COURSES_DATA !== 'undefined' && COURSES_DATA[AppState.currentCourseId]) {
      AppState.catalog = COURSES_DATA[AppState.currentCourseId].aulas;
      renderCatalogDashboard(AppState.catalog);
    }

    // 2. Inicialização dos Passos do Simulador da Aula
    const stepsIniciais = (typeof obterPassosSimulacao === 'function') ? obterPassosSimulacao(AppState.currentLessonId || 'aula_1_2') : [];
    if (typeof initSimulation === 'function') {
      initSimulation(stepsIniciais);
    }

    // 3. Renderização Visual Inicial (Cabeçalho e Retomada)
    if (typeof renderHeaderUser === 'function') renderHeaderUser();
    if (typeof renderizarOndePareiDashboard === 'function') renderizarOndePareiDashboard();

    // 4. Carregamento de Sessão e Sincronização Assíncrona com Backend
    if (typeof loadUserSession === 'function') loadUserSession();
    if (typeof loadCatalog === 'function') loadCatalog();

    // 5. Monitores Auxiliares
    if (typeof atualizarLabelsNavegacaoAulas === 'function') {
      atualizarLabelsNavegacaoAulas(AppState.currentLessonId || 'aula_1_2');
    }
    if (typeof inicializarMonitorInatividadeBarra === 'function') {
      inicializarMonitorInatividadeBarra();
    }
  } catch (err) {
    console.error('Erro na inicialização resiliente do PythonLab:', err);
  }
}

// Disparo garantido em qualquer ambiente
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', inicializarPythonLab);
} else {
  // O DOM já está pronto (caso frequente em iframes do Google Apps Script)
  inicializarPythonLab();
}
</script>
